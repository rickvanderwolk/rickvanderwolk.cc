<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>elders · de zwerm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Een zwarte kamer, groter dan je scherm, met alleen een zaklamp met drie kleuren licht. Onder rood trekt een zwerm van vijfhonderd dieren grillig door de ruimte, onder groen glijden de trage jagers waar ze voor wegdraaien, en onder blauw ligt het net van lijnen waarmee ze elkaar vasthouden.">
  <meta name="author" content="Rick van der Wolk">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; }
    body {
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body.binnen { cursor: none; }

    /* -- de lamp: een lichtvlek die de cursor vervangt -- */
    #lamp {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.09s ease;
    }
    #lamp.aan { opacity: 1; }

    /* -- de muur: een witte laag met vormen in geheime inkt, vermenig-
          vuldigd met het licht eronder (mix-blend-mode: multiply). Echte
          kleurfysica: een oppervlak kaatst alleen kleuren terug die het
          licht bevat. De vormen staan in complementaire kleuren:

            cyaan   kaatst groen+blauw  → alleen onder ROOD licht donker
            magenta kaatst rood+blauw   → alleen onder GROEN licht donker
            geel    kaatst rood+groen   → alleen onder BLAUW licht donker

          Onder de twee andere kleuren valt zo'n vorm exact weg tegen de
          aangelichte muur. Zwart blijft onder elke kleur een silhouet. -- */
    #muur {
      /* Geen background-color hier: het doek vult zichzelf elk frame
         wit. iOS 26 kleurt zijn status- en werkbalk naar de
         background-color van fixed elementen aan de randen (zonder de
         blend mee te rekenen) — een witte laag hier maakt die balken
         wit. */
      position: fixed; inset: 0;
      mix-blend-mode: multiply;
      pointer-events: none;
      overflow: hidden;
      font-weight: 700;
    }

    /* -- de randen: theme-color doet op iOS 26 niets meer; Safari leest
          de background-color van fixed elementen die de randen raken.
          Twee zwarte strookjes, onzichtbaar op de zwarte kamer, houden
          de balken donker. -- */
    .balk {
      position: fixed;
      left: 0; right: 0;
      height: 12px;
      background-color: #000;
      pointer-events: none;
      z-index: 10;
    }
    #balkboven { top: -8px; }
    #balkonder { bottom: -8px; }
    /* Het doek waarop de werken staan; de camera (schuiven/zoomen) wordt
       bij het tekenen toegepast, niet met CSS. */
    #wereld {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

    /* -- de drempel: een popup met tekst, daarachter is alles al zwart -- */
    #drempel {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 1;
      transition: opacity 1.8s ease;
    }
    #drempel.weg { opacity: 0; pointer-events: none; }
    #kader {
      max-width: 26em;
      border: 1px solid #2a2a2a;
      background: #050505;
      padding: 40px 44px 36px;
    }
    #kader p {
      color: #9a9a9a;
      font-size: 15px;
      line-height: 1.9;
      letter-spacing: 0.02em;
      margin-bottom: 32px;
    }
    #ok {
      display: block;
      margin: 0 auto;
      background: none;
      border: 1px solid #3a3a3a;
      color: #9a9a9a;
      font: inherit;
      font-size: 14px;
      letter-spacing: 0.12em;
      padding: 9px 34px;
      cursor: pointer;
      transition: border-color 0.4s ease, color 0.4s ease;
    }
    #ok:hover, #ok:focus-visible {
      border-color: #777;
      color: #ddd;
      outline: none;
    }
  </style>
</head>
<body>

<div class="balk" id="balkboven"></div>
<div class="balk" id="balkonder"></div>
<div id="lamp"></div>
<div id="muur">
  <canvas id="wereld"></canvas>
</div>

<div id="drempel">
  <div id="kader">
    <p>Hierachter ligt een kamer, groter dan je scherm. Er is geen wit
    licht; je lamp geeft er drie kleuren. Wat er te zien is, hangt af van
    welke kleur er brandt.</p>
    <button id="ok" type="button">ok</button>
  </div>
</div>

<script>
'use strict';

/* ---------------------------------------------------------------------------
   elders — de zwerm.

   Een drempel: een popup met tekst. Wie op ok drukt (of Enter) laat de
   tekst achter zich en staat in een zwarte kamer. Daar is niets te zien,
   alleen te horen. Het geluid komt langzaam op en zet een sfeer die net
   niet klopt: een lage drone waarvan de tonen elkaar bijna raken, ademende
   ruis als een ruimte die te groot is, en af en toe een flard die aanzwelt
   en dan halverwege ophoudt.

   In de kamer is je cursor weg. Klikken (of tikken) knipt een zaklamp
   aan: een lichtvlek die met je muis meebeweegt, of op mobiel staat
   waar je tikt — wie even vasthoudt heeft de lamp beet en schijnt met
   zijn vinger. Elke klik draait het filter verder: rood, groen, blauw —
   en dan weer donker. Er is geen wit licht.

   Wat er in de kamer hangt is één ding, in geheime inkt drie keer
   opgeschreven. Vijfhonderd dieren trekken als één lichaam door de
   ruimte; drie jagers glijden er dwars doorheen; en elk dier houdt zich
   vast aan zijn naaste buur. Dat is de hele wereld. Maar echte
   kleurfysica (multiply, geen truc) zet er drie verschillende sleutels op:
   cyaan bestaat alleen onder rood licht, magenta alleen onder groen, geel
   alleen onder blauw — onder de andere kleuren valt de inkt exact weg
   tegen de aangelichte muur.

   Onder rood zie je dus alleen de zwerm: streepjes met een korte staart,
   die zonder aanleiding wegdraaien, splitsen en weer sluiten. Onder groen
   zie je alleen de jagers, en pas dan snap je waar dat wegdraaien over
   ging. Onder blauw zie je alleen de banden: van elk dier één lijn naar
   de buur waar het zich op richt, samen een rimpelend net dat verraadt
   dat de zwerm geen wolk is maar een weefsel. Oorzaak en gevolg liggen
   uit elkaar getrokken over drie kleuren, en je hebt er nooit twee
   tegelijk.

   De kamer is groter dan het scherm. Slepen, vegen, scrollen of de
   pijltjes schuiven de wereld onder je licht door; knijpen of
   ctrl+scroll of +/− zoomt.
--------------------------------------------------------------------------- */

const drempel = document.getElementById('drempel');
const ok = document.getElementById('ok');
let binnen = false;

function gaBinnen() {
  if (binnen) return;
  binnen = true;
  drempel.classList.add('weg');
  document.body.classList.add('binnen');
  startGeluid();
}

ok.addEventListener('click', gaBinnen);
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') gaBinnen();
});
ok.focus();

/* --------------------------------- de lamp ------------------------------- */

/* Elke klik draait het filter één stand verder; na blauw is het weer
   donker. Alleen de drie kleuren — er is geen wit of warm licht, dus geen
   stand die alle inkten tegelijk verraadt. De standen zijn echt monochroom,
   anders lekt er alsnog van alles door. */
const STANDEN = [
  { kern: '255, 44, 26', rand: '212, 16, 8' },     // rood
  { kern: '46, 245, 60', rand: '12, 205, 36' },    // groen
  { kern: '46, 46, 255', rand: '18, 22, 224' },    // blauw
];

const lamp = document.getElementById('lamp');
let stand = -1;                    // -1 = uit
let px = innerWidth / 2;
let py = innerHeight / 2;

/* -------------------------------- de wereld ------------------------------ */

/* Eén zwerm, drie lezingen. De dieren, de jagers en de banden staan op
   exact dezelfde plek: het is niet drie keer iets anders in dezelfde
   kamer, het is drie keer dezelfde kamer.

     rood  → de zwerm (cyaan): vijfhonderd dieren die uitlijnen, bij
             elkaar blijven en niet botsen. Zonder de jagers erbij lijkt
             elke plotselinge draai onverklaarbaar.
     groen → de jagers (magenta): drie grote, trage vormen die er dwars
             doorheen glijden. Zij zijn de reden.
     blauw → de banden (geel): van elk dier één lijn naar zijn naaste
             buur; samen een net dat met de zwerm meerimpelt.

   Het doek is wit en alle inkt gaat er met globalCompositeOperation
   'multiply' overheen. Dat is niet alleen mooier (half doorzichtige inkt
   mag, dus verlopen en zachte staarten kunnen), het is ook nodig: bij
   gewoon over elkaar heen tekenen mengt half doorzichtige magenta zich in
   het rode kanaal van de cyane inkt eronder, en dan lekt de ene kleur in
   de andere. Vermenigvuldigen raakt per inkt maar één kanaal — cyaan
   alleen rood, magenta alleen groen, geel alleen blauw — dus de drie
   lagen kunnen elkaar niet verraden, in welke volgorde je ze ook tekent. */

const WERELD = { w: 4000, h: 3000 };
const CYAAN = 'rgb(0, 255, 255)';
const MAGENTA = 'rgb(255, 0, 255)';
const GEEL = 'rgb(255, 255, 0)';
const TAU = Math.PI * 2;

const doek = document.getElementById('wereld');
const dctx = doek.getContext('2d');
let dpr = 1;

function pasDoekAan() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  doek.width = Math.round(innerWidth * dpr);
  doek.height = Math.round(innerHeight * dpr);
}
pasDoekAan();

/* -- de dieren --

   Alles in platte typed arrays in plaats van vijfhonderd objecten: de
   lus eroverheen draait elk frame en moet op een telefoon binnen een paar
   milliseconden klaar zijn. */

const N = 500;
const ZICHT = 132;                 // zover ziet een dier zijn soortgenoten
const ZICHT2 = ZICHT * ZICHT;
const DRING = 40;                  // hierbinnen duwen ze elkaar weg
const DRING2 = DRING * DRING;
const UITLIJN = 3.2;               // meegaan met de richting van de buren
const SAMEN = 1.15;                // naar het midden van de buren toe
const DUW = 2500;                  // uit elkaar blijven
const TREK = 0.06;                 // heel zwak naar het hart van de zwerm
const ONRUST = 320;                // de trilling die een zwerm levend houdt
const SCHRIK = 2600;               // wegduiken voor een jager
const VLUCHT = 285;                // zover voelen ze er een
const VLUCHT2 = VLUCHT * VLUCHT;
const ZWERF = 260;                 // zover mag de zwerm van het midden af
const RAND = 300;                  // zachte terugduwing langs de wereldrand
const RAND_KRACHT = 3.2;
const SNEL_MIN = 128;
const SNEL_MAX = 214;
const STAART = 3;                  // bewaarde vorige posities per dier
const STAART_TIJD = 0.075;         // en zoveel seconde tussen twee daarvan

const bx = new Float32Array(N);
const by = new Float32Array(N);
const bvx = new Float32Array(N);
const bvy = new Float32Array(N);
const bnx = new Float32Array(N);   // genormaliseerde richting, voor het tekenen
const bny = new Float32Array(N);
const bmaat = new Float32Array(N); // lengte van het streepje
const bdruk = new Float32Array(N); // hoeveel ruimte dit dier voor zichzelf wil
const buur = new Int16Array(N);    // naaste buur, of -1
const bandQ = new Int8Array(N);    // sterkte van die band, 0 (zwak) t/m 3
const stx = new Float32Array(N * STAART);
const sty = new Float32Array(N * STAART);

/* Drie dieptelagen: verre dieren zijn kleiner en flauwer dan nabije. Dat
   kost niets aan rekenwerk maar geeft de zwerm dikte, en omdat de diepte
   vastligt kunnen de dieren één keer in drie lijstjes en gaat elke laag
   in één pad naar het doek. */
const LAGEN = [[], [], []];

/* De zwerm begint precies waar de bezoeker binnenkomt, dicht op elkaar en
   al in dezelfde richting: wie meteen zijn lamp aanknipt staat er middenin
   in plaats van in het donker te zoeken. Uit elkaar drijven doet hij vanzelf. */
const START = Math.random() * TAU;

for (let i = 0; i < N; i++) {
  const hoek = Math.random() * TAU;
  const r = Math.sqrt(Math.random()) * 430;
  bx[i] = WERELD.w / 2 + Math.cos(hoek) * r;
  by[i] = WERELD.h / 2 + Math.sin(hoek) * r * 0.8;
  const v = START + (Math.random() - 0.5) * 1.6;
  bvx[i] = Math.cos(v) * SNEL_MIN;
  bvy[i] = Math.sin(v) * SNEL_MIN;
  bnx[i] = Math.cos(v);
  bny[i] = Math.sin(v);
  const diepte = Math.random();
  bmaat[i] = 8 + diepte * diepte * 15;
  /* Ieder dier houdt een net iets andere afstand. Zonder die spreiding
     schikt een zwerm zich in een keurig rooster, en dat is precies wat
     hem dood maakt. */
  bdruk[i] = 0.6 + Math.random() * 0.9;
  LAGEN[diepte < 0.42 ? 0 : (diepte < 0.76 ? 1 : 2)].push(i);
  /* De staart begint niet leeg maar alsof het dier er al aan kwam: anders
     zijn het de eerste seconde stippen in plaats van streepjes. */
  for (let k = 0; k < STAART; k++) {
    const terug = (k + 1) * SNEL_MIN * STAART_TIJD;
    stx[i * STAART + k] = bx[i] - bnx[i] * terug;
    sty[i * STAART + k] = by[i] - bny[i] * terug;
  }
}

/* Buren en banden staan al klaar voor het eerste frame, zodat er onder
   blauw geen halve tel een net naar nergens hangt. */
for (let i = 0; i < N; i++) {
  buur[i] = -1;
  bandQ[i] = 0;
}

/* -- het rooster --

   Buurman zoeken over vijfhonderd dieren mag nooit ieder tegen ieder
   worden. De wereld ligt in cellen ter grootte van de zichtstraal; dan
   liggen alle buren die tellen in de negen cellen om je heen. De vulling
   gaat met een teloptelling in twee vaste arrays, zodat er per frame geen
   enkel nieuw object gemaakt hoeft te worden. */

const GW = Math.ceil(WERELD.w / ZICHT);
const GH = Math.ceil(WERELD.h / ZICHT);
const CELLEN = GW * GH;
const celVan = new Int32Array(N);
const celStart = new Int32Array(CELLEN + 1);
const celCursor = new Int32Array(CELLEN);
const celInhoud = new Int32Array(N);

function bouwRooster() {
  celStart.fill(0);
  for (let i = 0; i < N; i++) {
    let gx = (bx[i] / ZICHT) | 0;
    let gy = (by[i] / ZICHT) | 0;
    if (gx < 0) gx = 0; else if (gx >= GW) gx = GW - 1;
    if (gy < 0) gy = 0; else if (gy >= GH) gy = GH - 1;
    const c = gy * GW + gx;
    celVan[i] = c;
    celStart[c + 1]++;
  }
  for (let c = 0; c < CELLEN; c++) celStart[c + 1] += celStart[c];
  celCursor.set(celStart.subarray(0, CELLEN));
  for (let i = 0; i < N; i++) celInhoud[celCursor[celVan[i]]++] = i;
}

/* -- de jagers --

   Elke jager kiest om de paar tellen één dier uit en gaat daar achteraan.
   Dat is niet alleen geloofwaardiger dan een vaste baan door de ruimte,
   het is ook wat de drie kleuren op hun plek houdt: zolang een jager een
   dier volgt zit hij tussen de zwerm, en wie onder groen kijkt naar waar
   het onder rood druk was, vindt daar ook echt iets.

   Ze mikken niet recht op hun doel maar op een punt dat er langzaam
   omheen zwaait, zodat ze in bochten aankomen. Hun snelheid ligt onder
   de topsnelheid van een dier en hun bocht is veel wijder, dus vangen
   doen ze nooit — het gaat om de schrik, niet om de prooi. */

const JAGERS = [
  { x: 0, y: 0, hoek: 0, snel: 142, draai: 0.62, fase: 0.0, tempo: 0.29, zwaai: 300, doel: 0, klok: 1, lengte: 400, breedte: 74, golf: 0.0 },
  { x: 0, y: 0, hoek: 2, snel: 126, draai: 0.50, fase: 2.1, tempo: 0.21, zwaai: 380, doel: 0, klok: 5, lengte: 480, breedte: 78, golf: 2.4 },
  { x: 0, y: 0, hoek: 4, snel: 158, draai: 0.72, fase: 4.4, tempo: 0.37, zwaai: 240, doel: 0, klok: 9, lengte: 330, breedte: 80, golf: 4.9 },
];

let zwermX = WERELD.w / 2;
let zwermY = WERELD.h / 2;

/* Ze staan van het eerste frame af tussen de dieren. Een jager die eerst
   nog moet komen aanvliegen bestaat een halve minuut lang niet, en juist
   in die eerste halve minuut kijkt iedereen rond. */
for (const h of JAGERS) {
  h.doel = (Math.random() * N) | 0;
  h.x = bx[h.doel] + Math.cos(h.fase) * 220;
  h.y = by[h.doel] + Math.sin(h.fase) * 220;
  h.hoek = h.fase;
}

function jaagt(h, dt) {
  h.klok -= dt;
  if (h.klok <= 0) {
    h.doel = (Math.random() * N) | 0;
    h.klok = 5 + Math.random() * 8;
  }
  h.fase += h.tempo * dt;
  const dx = bx[h.doel] + Math.cos(h.fase) * h.zwaai - h.x;
  const dy = by[h.doel] + Math.sin(h.fase * 1.37) * h.zwaai - h.y;
  let verschil = Math.atan2(dy, dx) - h.hoek;
  while (verschil > Math.PI) verschil -= TAU;
  while (verschil < -Math.PI) verschil += TAU;
  const max = h.draai * dt;
  h.hoek += verschil > max ? max : (verschil < -max ? -max : verschil);
  h.x += Math.cos(h.hoek) * h.snel * dt;
  h.y += Math.sin(h.hoek) * h.snel * dt;
}

let staartKlok = 0;
let vorigeT = 0;

/* Alle natuurkunde van de zwerm in één lus: buren zoeken, sturen,
   verplaatsen, staart bijhouden. Wat hier uitkomt, wordt daarna drie keer
   anders getekend. */
function stuurZwerm(dt, t) {
  bouwRooster();
  for (const h of JAGERS) jaagt(h, dt);

  staartKlok += dt;
  const bewaar = staartKlok >= STAART_TIJD;
  if (bewaar) staartKlok = 0;

  /* Een trage stroming die alle kanten op draait: zonder zoiets blijft de
     zwerm in het midden van de wereld hangen. */
  let strX = Math.cos(t * 0.037) * 46 + Math.cos(t * 0.0113 + 1.4) * 36;
  let strY = Math.sin(t * 0.029 + 0.7) * 46 + Math.sin(t * 0.0091) * 36;

  /* En een lijn aan die stroming, want de kamer is groot: als de zwerm
     eenmaal een hoek in drijft is een zwerm die niemand ooit nog vindt.
     Voorbij ZWERF trekt het midden van de kamer hem terug, zodat hij
     altijd ligt waar je binnenkwam; daarbinnen merk je er niets van en
     gaat hij waar hij wil. */
  const afwX = zwermX - WERELD.w / 2;
  const afwY = zwermY - WERELD.h / 2;
  const afw = Math.hypot(afwX, afwY);
  if (afw > ZWERF) {
    const terug = (afw - ZWERF) * 0.8 / afw;
    strX -= afwX * terug;
    strY -= afwY * terug;
  }

  let somX = 0, somY = 0;

  for (let i = 0; i < N; i++) {
    const x = bx[i], y = by[i];
    const c = celVan[i];
    const gx = c % GW;
    const gy = (c / GW) | 0;
    const gx0 = gx > 0 ? gx - 1 : 0;
    const gx1 = gx < GW - 1 ? gx + 1 : GW - 1;
    const gy0 = gy > 0 ? gy - 1 : 0;
    const gy1 = gy < GH - 1 ? gy + 1 : GH - 1;

    const eigen = bdruk[i];
    let n = 0, uvx = 0, uvy = 0, mx = 0, my = 0, wx = 0, wy = 0;
    let besteD2 = ZICHT2, besteJ = -1;

    /* Cellen op één rij liggen achter elkaar in celInhoud, dus drie rijen
       is drie doorlopende stukken in plaats van negen losse. */
    for (let ry = gy0; ry <= gy1; ry++) {
      const rij = ry * GW;
      const eind = celStart[rij + gx1 + 1];
      for (let k = celStart[rij + gx0]; k < eind; k++) {
        const j = celInhoud[k];
        if (j === i) continue;
        const dx = bx[j] - x, dy = by[j] - y;
        const d2 = dx * dx + dy * dy;
        if (d2 > ZICHT2 || d2 < 0.0001) continue;
        n++;
        uvx += bvx[j]; uvy += bvy[j];
        mx += bx[j];   my += by[j];
        if (d2 < DRING2) {
          const f = eigen / d2;
          wx -= dx * f; wy -= dy * f;
        }
        if (d2 < besteD2) { besteD2 = d2; besteJ = j; }
      }
    }

    buur[i] = besteJ;
    if (besteJ >= 0) {
      let q = ((1 - Math.sqrt(besteD2) / ZICHT) * 4) | 0;
      bandQ[i] = q > 3 ? 3 : (q < 0 ? 0 : q);
    }

    let ax = strX + (zwermX - x) * TREK + (Math.random() - 0.5) * ONRUST;
    let ay = strY + (zwermY - y) * TREK + (Math.random() - 0.5) * ONRUST;

    if (n > 0) {
      ax += (uvx / n - bvx[i]) * UITLIJN + (mx / n - x) * SAMEN + wx * DUW;
      ay += (uvy / n - bvy[i]) * UITLIJN + (my / n - y) * SAMEN + wy * DUW;
    }

    for (let h = 0; h < JAGERS.length; h++) {
      const j = JAGERS[h];
      const dx = x - j.x, dy = y - j.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < VLUCHT2 && d2 > 1) {
        const d = Math.sqrt(d2);
        const over = 1 - d / VLUCHT;
        const k = over * over * SCHRIK / d;
        ax += dx * k; ay += dy * k;
      }
    }

    if (x < RAND) ax += (RAND - x) * RAND_KRACHT;
    else if (x > WERELD.w - RAND) ax -= (x - WERELD.w + RAND) * RAND_KRACHT;
    if (y < RAND) ay += (RAND - y) * RAND_KRACHT;
    else if (y > WERELD.h - RAND) ay -= (y - WERELD.h + RAND) * RAND_KRACHT;

    let vx = bvx[i] + ax * dt;
    let vy = bvy[i] + ay * dt;
    let sp = Math.sqrt(vx * vx + vy * vy);
    if (sp < 0.001) { vx = SNEL_MIN; vy = 0; sp = SNEL_MIN; }
    if (sp > SNEL_MAX) { const s = SNEL_MAX / sp; vx *= s; vy *= s; sp = SNEL_MAX; }
    else if (sp < SNEL_MIN) { const s = SNEL_MIN / sp; vx *= s; vy *= s; sp = SNEL_MIN; }

    bvx[i] = vx; bvy[i] = vy;
    bnx[i] = vx / sp; bny[i] = vy / sp;
    const nx = x + vx * dt, ny = y + vy * dt;
    bx[i] = nx; by[i] = ny;
    somX += nx; somY += ny;

    if (bewaar) {
      const o = i * STAART;
      stx[o + 2] = stx[o + 1]; sty[o + 2] = sty[o + 1];
      stx[o + 1] = stx[o];     sty[o + 1] = sty[o];
      stx[o] = nx;             sty[o] = ny;
    }
  }

  zwermX = somX / N;
  zwermY = somY / N;
}

/* -- rood: de zwerm --

   Per dieptelaag drie doorgangen die samen één toelopende veeg maken: een
   lange flauwe streep over de hele staart, een kortere en sterkere over
   het laatste stuk, en een smal gevuld driehoekje op de kop. Alles per
   doorgang in één pad, dus negen tekenopdrachten voor vijfhonderd dieren.
   Lijndikte staat in schermpixels (gedeeld door de zoom) zodat een
   uitgezoomde zwerm niet in haarlijntjes uiteenvalt. */
const ZWERM_VEEG = [0.16, 0.22, 0.28];   // de lange staart, per dieptelaag
const ZWERM_STREEP = [0.34, 0.46, 0.58]; // het laatste stuk staart
const ZWERM_KOP = [0.5, 0.72, 0.92];     // het driehoekje zelf
const ZWERM_DUN = [0.9, 1.3, 1.8];
const ZWERM_DIK = [1.5, 2.3, 3.2];
const ZWERM_DUN_W = [0.55, 0.85, 1.25];
const ZWERM_DIK_W = [0.95, 1.5, 2.2];

/* Lijndikte is een compromis tussen twee maten. In schermpixels blijft
   een uitgezoomde zwerm leesbaar in plaats van in haarlijntjes uiteen te
   vallen; in wereldpixels groeit de streep mee met de kop als je inzoomt,
   zodat een dier één vorm blijft en geen pijl met een dunne stok wordt.
   De dikste van de twee wint. */
function dikte(scherm, wereld) {
  const s = scherm / zoom;
  return s > wereld ? s : wereld;
}

function tekenZwerm(minX, minY, maxX, maxY) {
  dctx.strokeStyle = CYAAN;
  dctx.fillStyle = CYAAN;
  dctx.lineCap = 'round';
  dctx.lineJoin = 'round';

  for (let laag = 0; laag < 3; laag++) {
    const lijst = LAGEN[laag];

    dctx.globalAlpha = ZWERM_VEEG[laag];
    dctx.lineWidth = dikte(ZWERM_DUN[laag], ZWERM_DUN_W[laag]);
    dctx.beginPath();
    for (let a = 0; a < lijst.length; a++) {
      const i = lijst[a];
      const x = bx[i], y = by[i];
      if (x < minX || x > maxX || y < minY || y > maxY) continue;
      const o = i * STAART;
      dctx.moveTo(stx[o + 2], sty[o + 2]);
      dctx.lineTo(stx[o + 1], sty[o + 1]);
      dctx.lineTo(stx[o], sty[o]);
      dctx.lineTo(x, y);
    }
    dctx.stroke();

    dctx.globalAlpha = ZWERM_STREEP[laag];
    dctx.lineWidth = dikte(ZWERM_DIK[laag], ZWERM_DIK_W[laag]);
    dctx.beginPath();
    for (let a = 0; a < lijst.length; a++) {
      const i = lijst[a];
      const x = bx[i], y = by[i];
      if (x < minX || x > maxX || y < minY || y > maxY) continue;
      const o = i * STAART;
      dctx.moveTo(stx[o + 1], sty[o + 1]);
      dctx.lineTo(stx[o], sty[o]);
      dctx.lineTo(x, y);
    }
    dctx.stroke();

    dctx.globalAlpha = ZWERM_KOP[laag];
    dctx.beginPath();
    for (let a = 0; a < lijst.length; a++) {
      const i = lijst[a];
      const x = bx[i], y = by[i];
      if (x < minX || x > maxX || y < minY || y > maxY) continue;
      const L = bmaat[i];
      const ux = bnx[i], uy = bny[i];
      const kx = x + ux * L * 0.68, ky = y + uy * L * 0.68;
      const ax = x - ux * L * 0.32, ay = y - uy * L * 0.32;
      const zx = -uy * L * 0.135, zy = ux * L * 0.135;
      dctx.moveTo(kx, ky);
      dctx.lineTo(ax + zx, ay + zy);
      dctx.lineTo(ax - zx, ay - zy);
      dctx.closePath();
    }
    dctx.fill();
  }
}

/* Het lijf van een jager, in zijn eigen assenstelsel: de neus op +x. De
   breedte loopt via een sinus op en af (spits van voren, spits van
   achteren) en de staart slingert traag na. Eén functie, want de gloed
   eromheen is dezelfde vorm een paar keer opgeblazen. */
function jagerPad(h, t) {
  const L = h.lengte, W = h.breedte, S = 34;
  dctx.beginPath();
  for (let k = 0; k <= S; k++) {
    const u = k / S;
    const x = -L * 0.42 + u * L;
    const w = W * Math.pow(Math.sin(Math.PI * Math.pow(u, 1.35)), 0.85);
    const m = Math.sin(u * 3.6 - t * 1.2 + h.golf) * W * 0.40 * (1 - u) * (1 - u);
    if (k === 0) dctx.moveTo(x, m); else dctx.lineTo(x, m - w * 0.5);
  }
  for (let k = S; k >= 0; k--) {
    const u = k / S;
    const x = -L * 0.42 + u * L;
    const w = W * Math.pow(Math.sin(Math.PI * Math.pow(u, 1.35)), 0.85);
    const m = Math.sin(u * 3.6 - t * 1.2 + h.golf) * W * 0.40 * (1 - u) * (1 - u);
    dctx.lineTo(x, m + w * 0.5);
  }
  dctx.closePath();
}

/* -- groen: de jagers --

   Groot, glad en zonder één harde lijn. De vorm wordt niet één keer
   gevuld maar zestien keer, van net binnen het lijf tot net erbuiten,
   telkens zo flauw dat je die laag apart niet ziet. Waar alle zestien
   elkaar overlappen is het dier diep donker, en de laatste vingerbreedte
   naar buiten dooft het uit — een geairbrusht beest zonder omtrek. Dat is
   niet alleen mooier dan een silhouet met een rand: een harde rand is ook
   precies wat onder rood en blauw nog net zou opvallen, want geen enkele
   lampkleur is helemaal zuiver. Zachte inkt verraadt zichzelf niet.

   Daarbuiten nog een handvol veel ruimere kopieën en een brede
   elliptische gloed: dat is wat het beest groter maakt dan het is. */
const JAAG_KERN = 16;
const JAAG_WAAS = 6;

function tekenJagers(t, minX, minY, maxX, maxY) {
  for (let n = 0; n < JAGERS.length; n++) {
    const h = JAGERS[n];
    const marge = h.lengte;
    if (h.x < minX - marge || h.x > maxX + marge ||
        h.y < minY - marge || h.y > maxY + marge) continue;

    const L = h.lengte;
    dctx.save();
    dctx.translate(h.x, h.y);
    dctx.rotate(h.hoek);

    dctx.globalAlpha = 1;
    dctx.save();
    dctx.translate(L * 0.06, 0);
    dctx.scale(1, 0.46);
    const gloed = dctx.createRadialGradient(0, 0, 0, 0, 0, L);
    gloed.addColorStop(0, 'rgba(255, 0, 255, 0.10)');
    gloed.addColorStop(0.36, 'rgba(255, 0, 255, 0.055)');
    gloed.addColorStop(0.70, 'rgba(255, 0, 255, 0.018)');
    gloed.addColorStop(1, 'rgba(255, 0, 255, 0)');
    dctx.fillStyle = gloed;
    dctx.beginPath();
    dctx.arc(0, 0, L, 0, TAU);
    dctx.fill();
    dctx.restore();

    /* Het verloop over de lengte zit in de inkt zelf, dus elke kopie legt
       vooraan meer neer dan achteraan en de kop wordt het zwaarst. */
    const lijf = dctx.createLinearGradient(-L * 0.42, 0, L * 0.58, 0);
    lijf.addColorStop(0, 'rgba(255, 0, 255, 0.06)');
    lijf.addColorStop(0.34, 'rgba(255, 0, 255, 0.42)');
    lijf.addColorStop(0.74, 'rgba(255, 0, 255, 0.92)');
    lijf.addColorStop(0.94, 'rgba(255, 0, 255, 1)');
    lijf.addColorStop(1, 'rgba(255, 0, 255, 0.45)');
    dctx.fillStyle = lijf;

    dctx.globalAlpha = 0.013;
    for (let k = JAAG_WAAS - 1; k >= 0; k--) {
      const u = k / (JAAG_WAAS - 1);
      dctx.save();
      dctx.scale(1.22 + u * 0.85, 1.30 + u * 1.30);
      jagerPad(h, t);
      dctx.fill();
      dctx.restore();
    }

    dctx.globalAlpha = 0.053;
    for (let k = JAAG_KERN - 1; k >= 0; k--) {
      const u = k / (JAAG_KERN - 1);
      dctx.save();
      dctx.scale(0.84 + u * 0.34, 0.70 + u * 0.54);
      jagerPad(h, t);
      dctx.fill();
      dctx.restore();
    }

    dctx.restore();
  }
}

/* -- blauw: de banden --

   Van elk dier één lijn naar de buur waar het zich op richt. Korte banden
   zijn sterk, lange doven uit; die vier sterktes zijn vooraf uitgerekend,
   zodat er per sterkte één pad en één stroke overblijft in plaats van
   vijfhonderd losse lijnen. De knoopjes op de dieren zelf geven het net
   iets geweven mee. */
const BAND_ALFA = [0.11, 0.20, 0.31, 0.46];
const BAND_DIK = [0.7, 0.9, 1.15, 1.5];
const BAND_WAAS = [0.028, 0.042, 0.058, 0.078];
const BAND_WIJD = [3.4, 4.2, 5.2, 6.4];
const BAND_DIK_W = [0.45, 0.6, 0.8, 1.05];
const BAND_WIJD_W = [2.2, 2.8, 3.6, 4.5];

function tekenBanden(minX, minY, maxX, maxY) {
  dctx.strokeStyle = GEEL;
  dctx.lineCap = 'round';

  /* Twee doorgangen per sterkte: eerst een brede, bijna niet aanwezige
     waas, daarbovenop de draad zelf. Zonder die waas zijn het harde
     zwarte draden — met is het licht dat langs een draad valt. */
  for (let beurt = 0; beurt < 2; beurt++) {
    for (let q = 0; q < 4; q++) {
      dctx.globalAlpha = beurt === 0 ? BAND_WAAS[q] : BAND_ALFA[q];
      dctx.lineWidth = beurt === 0 ? dikte(BAND_WIJD[q], BAND_WIJD_W[q])
                                   : dikte(BAND_DIK[q], BAND_DIK_W[q]);
      dctx.beginPath();
      for (let i = 0; i < N; i++) {
        if (bandQ[i] !== q) continue;
        const j = buur[i];
        if (j < 0) continue;
        const x = bx[i], y = by[i];
        if (x < minX || x > maxX || y < minY || y > maxY) continue;
        dctx.moveTo(x, y);
        dctx.lineTo(bx[j], by[j]);
      }
      dctx.stroke();
    }
  }

  /* De knopen: waar de draden samenkomen zit een dier. Een wijde zachte
     stip eronder, een kleine harde erop. */
  dctx.fillStyle = GEEL;
  for (let beurt = 0; beurt < 2; beurt++) {
    dctx.globalAlpha = beurt === 0 ? 0.055 : 0.30;
    const kr = beurt === 0 ? dikte(4.2, 2.9) : dikte(1.7, 1.2);
    dctx.beginPath();
    for (let i = 0; i < N; i++) {
      const x = bx[i], y = by[i];
      if (x < minX || x > maxX || y < minY || y > maxY) continue;
      dctx.moveTo(x + kr, y);
      dctx.arc(x, y, kr, 0, TAU);
    }
    dctx.fill();
  }
}

function tekenWereld(t) {
  const dt = Math.min(t - vorigeT, 0.05);
  vorigeT = t;

  /* uitrol: na een veeg rolt de wereld nog even door */
  if (vingers.size === 0 && (vaartX || vaartY)) {
    cx -= vaartX * dt / zoom;
    cy -= vaartY * dt / zoom;
    toonWereld();
    const rem = Math.exp(-4 * dt);
    vaartX *= rem;
    vaartY *= rem;
    if (Math.hypot(vaartX, vaartY) < 6) {
      vaartX = 0;
      vaartY = 0;
    }
  }

  if (dt > 0) stuurZwerm(dt, t);

  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.globalAlpha = 1;
  dctx.fillStyle = '#fff';
  dctx.fillRect(0, 0, innerWidth, innerHeight);
  dctx.setTransform(dpr * zoom, 0, 0, dpr * zoom,
    dpr * (innerWidth / 2 - cx * zoom), dpr * (innerHeight / 2 - cy * zoom));
  dctx.globalCompositeOperation = 'multiply';

  /* Alles buiten het venster overslaan; de marge is ruim genoeg voor een
     staart of een driehoekje dat half over de rand hangt. */
  const halfW = innerWidth / (2 * zoom);
  const halfH = innerHeight / (2 * zoom);
  const minX = cx - halfW - 60;
  const maxX = cx + halfW + 60;
  const minY = cy - halfH - 60;
  const maxY = cy + halfH + 60;

  /* De volgorde doet er niet toe: vermenigvuldigen laat de drie inkten
     elk in hun eigen kanaal. */
  tekenBanden(minX, minY, maxX, maxY);
  tekenJagers(t, minX, minY, maxX, maxY);
  tekenZwerm(minX, minY, maxX, maxY);

  dctx.globalAlpha = 1;
  dctx.globalCompositeOperation = 'source-over';
}

requestAnimationFrame(function stap(ms) {
  tekenWereld(ms / 1000);
  requestAnimationFrame(stap);
});

/* ------------------------------- de camera ------------------------------- */

let cx = WERELD.w / 2;             // wereldpunt in het midden van het scherm
let cy = WERELD.h / 2;
let zoom = 1;
const ZOOM_MIN = 0.22;
const ZOOM_MAX = 3.5;

/* De camera wordt elk frame bij het tekenen toegepast; hier hoeven we
   hem alleen binnen de wereld te houden. */
function toonWereld() {
  cx = Math.max(0, Math.min(WERELD.w, cx));
  cy = Math.max(0, Math.min(WERELD.h, cy));
}

/* Zoomen om een schermpunt heen: wat onder je cursor of tussen je vingers
   ligt, blijft daar liggen. */
function zoomNaar(factor, mx, my) {
  const wx = cx + (mx - innerWidth / 2) / zoom;
  const wy = cy + (my - innerHeight / 2) / zoom;
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * factor));
  cx = wx - (mx - innerWidth / 2) / zoom;
  cy = wy - (my - innerHeight / 2) / zoom;
  toonWereld();
}

toonWereld();
window.addEventListener('resize', () => { pasDoekAan(); toonWereld(); schijn(); });

/* ------------------------------ de besturing -----------------------------

   Desktop: muis beweegt de lamp, slepen of scrollen schuift de wereld,
   pinch op trackpad (ctrl+scroll) of +/− zoomt, pijltjes schuiven ook.

   Mobiel, zoals je vingers het al kennen:
     tik           — lamp een stand verder, op de plek waar je tikt
     vegen         — de wereld schuiven (met uitrol); het licht blijft
                     staan waar het scheen
     vasthouden    — na een tel heb je de lamp beet: beweeg, en het
                     licht gaat met je vinger mee
     twee vingers  — knijpen zoomt, samen bewegen schuift

   Tikken gaat via pointerup, niet via click: iOS laat click op
   window nog wel eens vallen. */

const vingers = new Map();         // actieve pointers (knop ingedrukt / vinger op scherm)
let sleep = 0;                     // afgelegde sleepafstand, om tik van veeg te scheiden
let modus = null;                  // null (nog onbeslist) | 'lamp' | 'schuif' | 'knijp'
let greep = 0;                     // timer die van vasthouden een greep op de lamp maakt
let vaartX = 0, vaartY = 0;        // uitrol van de wereld na loslaten, in schermpx/s

const GREEP_MS = 300;              // zo lang is vasthouden
const TIK_PX = 10;                 // tot hier beweegt een tik

window.addEventListener('pointerdown', (e) => {
  if (!binnen || drempel.contains(e.target)) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  vaartX = 0;                      // een vinger op het scherm stopt de uitrol
  vaartY = 0;
  const v = { x: e.clientX, y: e.clientY, t: e.timeStamp };
  vingers.set(e.pointerId, v);
  if (vingers.size === 1) {
    sleep = 0;
    modus = null;
    if (e.pointerType !== 'mouse') {
      greep = setTimeout(() => {
        if (modus !== null) return;
        modus = 'lamp';
        px = v.x;
        py = v.y;
        if (stand >= 0) schijn();
      }, GREEP_MS);
    }
  } else {
    clearTimeout(greep);
    modus = 'knijp';
  }
});

window.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') {
    px = e.clientX;
    py = e.clientY;
    if (stand >= 0) schijn();
  }
  const v = vingers.get(e.pointerId);
  if (!v || !binnen) return;

  if (modus === 'knijp') {
    if (vingers.size !== 2) return;
    // knijpen: zoomen om het midden tussen de vingers, en meebewegen
    const [a, b] = [...vingers.values()];
    const oudeAfstand = Math.hypot(a.x - b.x, a.y - b.y);
    const oudeMx = (a.x + b.x) / 2;
    const oudeMy = (a.y + b.y) / 2;
    v.x = e.clientX;
    v.y = e.clientY;
    const nieuweAfstand = Math.hypot(a.x - b.x, a.y - b.y);
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    cx -= (mx - oudeMx) / zoom;
    cy -= (my - oudeMy) / zoom;
    if (oudeAfstand > 0) zoomNaar(nieuweAfstand / oudeAfstand, mx, my);
  } else if (modus === 'lamp') {
    // de lamp zit aan je vinger
    v.x = e.clientX;
    v.y = e.clientY;
    px = e.clientX;
    py = e.clientY;
    if (stand >= 0) schijn();
  } else {
    const dx = e.clientX - v.x;
    const dy = e.clientY - v.y;
    const dt = (e.timeStamp - v.t) / 1000;
    v.x = e.clientX;
    v.y = e.clientY;
    v.t = e.timeStamp;
    sleep += Math.abs(dx) + Math.abs(dy);
    if (modus === null) {
      if (sleep <= TIK_PX) return;  // nog geen veeg
      clearTimeout(greep);
      modus = 'schuif';
    }
    cx -= dx / zoom;
    cy -= dy / zoom;
    toonWereld();
    if (e.pointerType !== 'mouse' && dt > 0) {
      // vaart bijhouden voor de uitrol, wat gladgestreken
      vaartX = 0.75 * vaartX + 0.25 * (dx / dt);
      vaartY = 0.75 * vaartY + 0.25 * (dy / dt);
    }
  }
});

window.addEventListener('pointerup', (e) => {
  const v = vingers.get(e.pointerId);
  vingers.delete(e.pointerId);
  if (!v || !binnen) return;
  if (vingers.size === 0) {
    clearTimeout(greep);
    if (modus === null && sleep <= TIK_PX) {
      // een tik: de lamp een stand verder, op de plek van de tik
      px = e.clientX;
      py = e.clientY;
      stand = stand >= STANDEN.length - 1 ? -1 : stand + 1;
      schijn();
    }
    // geen uitrol na een tik of een greep, of als de veeg al stilstond
    if (modus !== 'schuif' || e.timeStamp - v.t > 80) {
      vaartX = 0;
      vaartY = 0;
    }
    modus = null;
  } else if (modus === 'knijp' && vingers.size === 1) {
    // één vinger blijft over: die schuift verder
    const rest = vingers.values().next().value;
    rest.t = e.timeStamp;
    modus = 'schuif';
  }
});

window.addEventListener('pointercancel', (e) => {
  vingers.delete(e.pointerId);
  if (vingers.size === 0) {
    clearTimeout(greep);
    modus = null;
  }
});

window.addEventListener('wheel', (e) => {
  if (!binnen) return;
  e.preventDefault();
  if (e.ctrlKey) {
    zoomNaar(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  } else {
    cx += e.deltaX / zoom;
    cy += e.deltaY / zoom;
    toonWereld();
  }
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (!binnen) return;
  const stap = 90 / zoom;
  if (e.key === 'ArrowLeft') cx -= stap;
  else if (e.key === 'ArrowRight') cx += stap;
  else if (e.key === 'ArrowUp') cy -= stap;
  else if (e.key === 'ArrowDown') cy += stap;
  else if (e.key === '+' || e.key === '=') { zoomNaar(1.18, innerWidth / 2, innerHeight / 2); return; }
  else if (e.key === '-') { zoomNaar(1 / 1.18, innerWidth / 2, innerHeight / 2); return; }
  else return;
  e.preventDefault();
  toonWereld();
});

/* De straal van de lichtvlek. Op een telefoon is de korte schermkant
   zo smal dat een deel ervan bijna niets is, maar de lange kant nemen
   toont juist te veel — dan is het zoeken eraf. Het gemiddelde van
   beide zit er netjes tussenin (~een kwart van de breedte in portret). */
function lampStraal() {
  const kort = Math.min(innerWidth, innerHeight);
  return kort < 600 ? (innerWidth + innerHeight) * 0.08 : kort * 0.16;
}

/* Twee lagen licht: een kleine hete kern en een ruime, zwakke gloed
   eromheen. De vele tussenstappen benaderen het kwadratische verval van
   echt licht — dat oogt zachter en voorkomt harde randen en banding. */
function schijn() {
  if (stand < 0) {
    lamp.classList.remove('aan');
    return;
  }
  const s = STANDEN[stand];
  const r = lampStraal();
  const plek = `at ${px}px ${py}px`;
  lamp.style.background =
    `radial-gradient(circle ${r}px ${plek},` +
    ` rgba(${s.kern}, 0.9) 0%,` +
    ` rgba(${s.kern}, 0.62) 22%,` +
    ` rgba(${s.rand}, 0.34) 44%,` +
    ` rgba(${s.rand}, 0.14) 66%,` +
    ` rgba(${s.rand}, 0.04) 84%,` +
    ` rgba(0, 0, 0, 0) 100%),` +
    `radial-gradient(circle ${r * 2.6}px ${plek},` +
    ` rgba(${s.rand}, 0.1) 0%,` +
    ` rgba(${s.rand}, 0.05) 45%,` +
    ` rgba(${s.rand}, 0.015) 72%,` +
    ` rgba(0, 0, 0, 0) 100%)`;
  lamp.classList.add('aan');
}

/* -------------------------------- het geluid ----------------------------- */

let ctx = null;

function startGeluid() {
  /* Vraag de browser dit als media te behandelen: dan speelt het door
     met de stilschakelaar om en op de achtergrond waar dat mag. */
  if (navigator.audioSession) navigator.audioSession.type = 'playback';

  ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();

  /* Vooral iOS zet de context stil bij tabwissel of vergrendelen en
     niet vanzelf weer aan; wek hem bij elk teken van leven. */
  const wek = () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); };
  ctx.onstatechange = wek;
  document.addEventListener('visibilitychange', wek);
  window.addEventListener('focus', wek);
  window.addEventListener('pointerdown', wek);

  /* Master met limiter, en een heel trage opkomst: het geluid is er niet
     ineens, het blijkt er te zijn. */
  const eind = ctx.createDynamicsCompressor();
  eind.threshold.value = -18;
  eind.ratio.value = 8;
  eind.connect(ctx.destination);

  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.gain.setTargetAtTime(0.5, ctx.currentTime + 0.5, 4.5);
  master.connect(eind);

  /* Galm zonder galmbestand: twee kruislings gevoede delays met een
     lowpass in de lus. Alles wat hierin gaat, sterft donker en lang uit. */
  const ruimte = maakRuimte(master);

  drone(master);
  adem(master);
  planFlard(ruimte);
}

/* Laag 1 — de drone. Twee paren sinussen die elkaar nét niet raken (trage
   zwevingen), plus een kwint die een fractie te hoog ligt. Een heel trage
   LFO laat het geheel onmerkbaar op drift slaan. */
function drone(dest) {
  const g = ctx.createGain();
  g.gain.value = 1;
  g.connect(dest);

  const drift = ctx.createOscillator();
  drift.frequency.value = 0.017;
  const driftDiepte = ctx.createGain();
  driftDiepte.gain.value = 9; // cents
  drift.connect(driftDiepte);
  drift.start();

  [[49, 0.22], [49.38, 0.22], [98, 0.1], [98.71, 0.1], [148.6, 0.045]]
    .forEach(([freq, vol]) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      driftDiepte.connect(o.detune);
      const og = ctx.createGain();
      og.gain.value = vol;
      o.connect(og).connect(g);
      o.start();
    });
}

/* Laag 2 — adem. Gefilterde ruis, heel zacht, als een ruimte die te groot
   is voor wie erin staat. Het filter zwerft langzaam heen en weer. */
function adem(dest) {
  const duur = 4;
  const buf = ctx.createBuffer(1, ctx.sampleRate * duur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const bron = ctx.createBufferSource();
  bron.buffer = buf;
  bron.loop = true;

  const band = ctx.createBiquadFilter();
  band.type = 'bandpass';
  band.frequency.value = 700;
  band.Q.value = 7;

  const zwerf = ctx.createOscillator();
  zwerf.frequency.value = 0.011;
  const zwerfDiepte = ctx.createGain();
  zwerfDiepte.gain.value = 380;
  zwerf.connect(zwerfDiepte).connect(band.frequency);
  zwerf.start();

  const g = ctx.createGain();
  g.gain.value = 0.03;
  bron.connect(band).connect(g).connect(dest);
  bron.start();
}

/* Laag 3 — flarden. Op onregelmatige momenten zwelt ergens een toon aan,
   seconden lang, en houdt dan abrupt op — de galm maakt het af. De
   toonhoogtes komen uit geen enkele toonladder. */
function planFlard(ruimte) {
  const wacht = 8 + Math.random() * 16; // seconden
  setTimeout(() => {
    if (ctx) flard(ruimte);
    planFlard(ruimte);
  }, wacht * 1000);
}

function flard(ruimte) {
  const t = ctx.currentTime;
  const zwel = 2.5 + Math.random() * 4;
  const freq = 240 * Math.pow(2, Math.random() * 2.3); // 240–1180 Hz, ongebonden

  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.linearRampToValueAtTime(freq * (0.985 + Math.random() * 0.03), t + zwel);

  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.055, t + zwel);
  g.gain.setValueAtTime(0.0001, t + zwel); // abrupt weg

  const pan = ctx.createStereoPanner();
  pan.pan.value = Math.random() * 1.6 - 0.8;

  o.connect(g).connect(pan).connect(ruimte);
  o.start(t);
  o.stop(t + zwel + 0.1);
}

/* De ruimte: twee delays die elkaar voeden, met een donker filter in de
   lus zodat elke herhaling doffer wordt. */
function maakRuimte(dest) {
  const inlaat = ctx.createGain();
  inlaat.gain.value = 1;

  const d1 = ctx.createDelay(2);
  d1.delayTime.value = 0.41;
  const d2 = ctx.createDelay(2);
  d2.delayTime.value = 0.63;

  const terug1 = ctx.createGain();
  terug1.gain.value = 0.5;
  const terug2 = ctx.createGain();
  terug2.gain.value = 0.5;

  const dof = ctx.createBiquadFilter();
  dof.type = 'lowpass';
  dof.frequency.value = 1600;

  inlaat.connect(dest);          // droog
  inlaat.connect(dof);
  dof.connect(d1);
  dof.connect(d2);
  d1.connect(terug1).connect(d2);
  d2.connect(terug2).connect(d1);
  d1.connect(dest);
  d2.connect(dest);

  return inlaat;
}
