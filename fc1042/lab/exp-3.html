<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>fc1042 — exp-3</title>
<style>
  :root {
    --ink:   rgba(255,236,205,0.92);   /* warm wit, spaarzaam gebruikt */
    --zacht: rgba(255,236,205,0.40);
    --flauw: rgba(255,236,205,0.13);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink);
               font: 11px/1.5 'Courier New', monospace; letter-spacing: 1px;
               -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* dunne lijn bovenin die ademt terwijl er gerenderd wordt — geen woord nodig */
  #bezig { position: fixed; top: 0; left: 0; right: 0; height: 1px; background: var(--ink);
           opacity: 0; transition: opacity .35s; z-index: 20; }
  #bezig.aan { opacity: .8; animation: pols 1.1s ease-in-out infinite; }
  @keyframes pols { 0%,100% { opacity: .18 } 50% { opacity: .85 } }

  /* ── de sporen: foto's, verder niets ─────────────────────────────────── */
  #sporen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 12px 12px; align-content: start; }

  .tegel { position: relative; aspect-ratio: 1; border-radius: 3px; overflow: hidden;
           background: #0c0c0d; transition: opacity .3s; }
  .tegel.gedempt { opacity: .28; }
  .tegel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .net { position: absolute; inset: 0; display: grid; gap: 1px; padding: 1px; }
  .net i { border: 1px solid rgba(255,236,205,0.10); border-radius: 1px;
           transition: background .12s linear; }
  .net i.aan  { background: rgba(255,236,205,0.17); border-color: rgba(255,236,205,0.26); }
  .net i.nu   { border-color: rgba(255,255,255,0.6); }
  .net i.vuur { background: rgba(255,236,205,0.85); border-color: rgba(255,236,205,0.9);
                transition: none; }

  /* icoonbalkje drijft over de foto, op een zachte sluier zodat het altijd leesbaar is */
  .balk { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center;
          gap: 2px; padding: 16px 4px 4px;
          background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,0)); }
  .balk button { padding: 7px; color: rgba(255,236,205,0.55); transition: color .15s; }
  .balk button:active { color: #fff; }
  .balk .klank { margin-right: auto; padding-left: 6px; color: rgba(255,236,205,0.5); }

  /* het plus-vak: zelfde formaat als een foto, alleen leeg */
  .nieuw { display: flex; align-items: center; justify-content: center;
           border: 1px solid var(--flauw); color: var(--zacht); }
  .nieuw:active { border-color: var(--ink); color: var(--ink); }

  /* ── onderbalk ───────────────────────────────────────────────────────── */
  #onder { display: flex; align-items: center; justify-content: center; gap: 22px;
           padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
           border-top: 1px solid var(--flauw); }
  #speel { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
           border: 1px solid var(--flauw); border-radius: 50%; }
  #speel:active { border-color: var(--ink); }
  #speel[disabled] { opacity: .25; }
  .chip { color: var(--zacht); padding: 10px 4px; min-width: 54px; text-align: center; }
  .chip:active { color: var(--ink); }

  /* ── overlays ────────────────────────────────────────────────────────── */
  .laag { position: fixed; inset: 0; z-index: 10; background: #000; display: none; }
  .laag.aan { display: block; }
  .hoek { position: absolute; top: calc(10px + env(safe-area-inset-top)); z-index: 3; padding: 12px;
          color: rgba(255,236,205,0.65); }
  .hoek:active { color: #fff; }
  .hoek.links { left: 8px; } .hoek.rechts { right: 8px; }

  /* geluid kiezen: alleen golfjes, geen woorden behalve een fluisterlabel */
  #kiezer { display: none; }
  #kiezer.aan { display: grid; align-content: center; }
  #kiezer .lijst { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
                   padding: 20px; max-width: 460px; margin: 0 auto; width: 100%; }
  #kiezer .lijst button { padding: 22px 14px; border: 1px solid var(--flauw); border-radius: 3px;
                          display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #kiezer .lijst button:active { border-color: var(--ink); background: rgba(255,236,205,0.05); }
  #kiezer .lijst span { color: rgba(255,236,205,0.32); font-size: 9px; letter-spacing: 2px; }

  /* camera */
  #zoeker video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #lijnen { position: absolute; inset: 0; display: grid; gap: 2px; padding: 2px; pointer-events: none; }
  #lijnen i { border: 1px solid rgba(255,236,205,0.22); border-radius: 1px; transition: background .12s; }
  #lijnen i.aan { background: rgba(255,236,205,0.30); border-color: rgba(255,236,205,0.7); }
  #sluiter { position: absolute; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom));
             transform: translateX(-50%); width: 72px; height: 72px; border-radius: 50%;
             border: 2px solid rgba(255,255,255,0.9); background: rgba(0,0,0,0.2); }
  #sluiter:active { background: rgba(255,255,255,0.55); }
  #tip { position: absolute; left: 0; right: 0; bottom: calc(118px + env(safe-area-inset-bottom));
         text-align: center; color: rgba(255,255,255,0.55); text-shadow: 0 0 8px #000;
         transition: opacity 1.2s; }
  #tip.weg { opacity: 0; }
  #flits { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* de foto groot — tik ergens om te sluiten */
  #groot { display: none; }
  #groot.aan { display: flex; align-items: center; justify-content: center; }
  #groot .kader { position: relative; width: min(94vw, 94vh); aspect-ratio: 1; }
  #groot img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div id="bezig"></div>

<div id="app">
  <div id="sporen"></div>
  <div id="onder">
    <button class="chip" id="tempo">95</button>
    <button id="speel" disabled></button>
    <button class="chip" id="rasterknop">4×4</button>
  </div>
</div>

<!-- de lus speelt als gewone audiotrack: gaat door in de achtergrond -->
<audio id="track" loop playsinline></audio>

<div class="laag" id="kiezer">
  <div class="lijst"></div>
  <button class="hoek links" id="kiezerUit"></button>
</div>

<div class="laag" id="zoeker">
  <video id="cam" playsinline muted autoplay></video>
  <div id="lijnen"></div>
  <div id="tip">licht wordt klank</div>
  <button id="sluiter"></button>
  <div id="flits"></div>
  <button class="hoek links" id="zoekerUit"></button>
  <button class="hoek rechts" id="camkeuze"></button>
</div>

<div class="laag" id="groot">
  <div class="kader"><img id="grootFoto"><div class="net" id="grootNet"></div></div>
</div>

<script>
// fc1042 — exp-3: FOTOSTUDIO
// ==========================
// Als exp-2 (foto's worden patronen), maar gebouwd als een plaat in plaats van
// een live instrument. Drie dingen volgen daaruit:
//
//  1. HET SPEELT DOOR MET HET SCHERM OP SLOT. Web Audio wordt door iOS
//     bevroren zodra de pagina naar de achtergrond gaat; een <audio>-element
//     niet. Dus renderen we de hele lus offline naar een WAV en spelen die af
//     als gewone track — inclusief bediening op je lockscreen.
//
//  2. HET AANTAL SPOREN IS GRATIS. Wat je hoort is één bestand, of je nu twee
//     of twintig sporen hebt. Alleen het renderen duurt langer; het afspelen
//     kost altijd evenveel.
//
//  3. JE HOORT HET PAS NA HET AFDRUKKEN. Dat is de prijs: exp-2 laat je live
//     meeluisteren tijdens het richten, hier is het een polaroid. In de zoeker
//     zie je wel welke vakjes gaan klinken.
//
// De originele foto's blijven bewaard en zijn groot te bekijken, met het raster
// eroverheen, zodat je ziet welk stuk beeld welke tik is.

// ── knoppen ────────────────────────────────────────────────────────────────
const BRON        = 64;        // analyseformaat
const BEWAAR      = 640;       // formaat waarop de foto zelf bewaard blijft
const TEMPOS      = [80, 95, 110, 125];
const RASTERS     = [3, 4, 5];
const SWING       = 0.06;
const HERHALINGEN = 4;         // hoe vaak de lus in het bestand staat (zie 'naadje')
const STAART      = 2.2;       // s uitloop, wordt op het begin teruggevouwen
const SR          = 44100;

const GRONDTOON = 55;
const SCHALEN = {
  mineur:   [0, 2, 3, 5, 7, 8, 10],
  dorisch:  [0, 2, 3, 5, 7, 9, 10],
  frygisch: [0, 1, 3, 5, 7, 8, 10],
  mixo:     [0, 2, 4, 5, 7, 9, 10],
};
let schaal = 'mineur', toonsoortGezet = false;

const INSTRUMENTEN = [
  { id: 'kick',  naam: 'kick'  },
  { id: 'hihat', naam: 'hihat' },
  { id: 'clap',  naam: 'clap'  },
  { id: 'bas',   naam: 'bas',  oct: 1 },
  { id: 'bel',   naam: 'bel',  oct: 3 },
  { id: 'pad',   naam: 'pad',  oct: 2 },
];

let raster = 4, bpm = 95;
let sporen = [];
let stapTijden = [], lusDuur = 0, speelt = false, rendertNu = false, opnieuwNodig = false;

// ── iconen ─────────────────────────────────────────────────────────────────
const ICOON = {
  camera: '<path d="M3 8.6a2 2 0 0 1 2-2h2.1L8.4 4.6h7.2l1.3 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.6" r="3.3"/>',
  luid:   '<path d="M4 9.4h3.6L12 5.4v13.2L7.6 14.6H4z"/><path d="M15.4 9.9a3.5 3.5 0 0 1 0 5.2"/><path d="M17.7 7.7a6.7 6.7 0 0 1 0 9.6"/>',
  dof:    '<path d="M4 9.4h3.6L12 5.4v13.2L7.6 14.6H4z"/><path d="M16 10.2l4.2 4.2M20.2 10.2L16 14.4"/>',
  prul:   '<path d="M4.2 6.8h15.6M9.6 6.8V4.6h4.8v2.2"/><path d="M6.6 6.8L7.6 19.4h8.8l1-12.6"/><path d="M10.4 10v6M13.6 10v6"/>',
  golf:   '<path d="M3 12h2.2l2-6.4 3 12.8 2.8-9 2 5 1.8-2.4H21"/>',
  terug:  '<path d="M15 4.5L7.5 12 15 19.5"/>',
  draai:  '<path d="M4.2 12a7.8 7.8 0 0 1 13.2-5.6M19.8 12a7.8 7.8 0 0 1-13.2 5.6"/><path d="M17.6 3.4v3.4h-3.4M6.4 20.6v-3.4h3.4"/>',
  plus:   '<path d="M12 5.5v13M5.5 12h13"/>',
  pauze:  '<path d="M9.5 5.5v13M14.5 5.5v13"/>',
};

function icoon(naam, maat) {
  return '<svg viewBox="0 0 24 24" width="' + (maat || 19) + '" height="' + (maat || 19) +
         '" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" ' +
         'stroke-linejoin="round">' + ICOON[naam] + '</svg>';
}
function speelIcoon() {
  return '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M8.5 5.4v13.2L19 12z"/></svg>';
}

// Elk instrument tekent zichzelf: de golf ís de envelope van dat geluid. Geen
// woord nodig om het verschil tussen een kick en een bel te laten zien.
function golfPad(id) {
  const par = {
    kick:  { verval: 0.09, hz: 2.2, ruis: false },
    hihat: { verval: 0.05, hz: 0,   ruis: true  },
    clap:  { verval: 0.14, hz: 0,   ruis: true  },
    bas:   { verval: 0.30, hz: 4,   ruis: false },
    bel:   { verval: 0.55, hz: 11,  ruis: false },
    pad:   { verval: 1.60, hz: 6,   ruis: false, zwel: 0.30 },
  }[id];
  const B = 46, H = 24, mid = H / 2, n = 92, punten = [];
  for (let i = 0; i <= n; i++) {
    const x = i / n;
    let amp = Math.exp(-x / par.verval);
    if (par.zwel) amp *= Math.min(1, x / par.zwel);
    const w = par.ruis ? (Math.sin(i * 12.9898) * 43758.5453) % 1 : Math.sin(x * par.hz * 6.2832);
    punten.push((x * B).toFixed(1) + ',' + (mid - w * amp * (mid - 1.6)).toFixed(1));
  }
  return '<svg viewBox="0 0 46 24" width="46" height="24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M' +
         punten.join('L') + '"/></svg>';
}

// ── foto lezen (gelijk aan exp-2) ──────────────────────────────────────────
function rgbNaarHS(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (mx === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
  }
  return { h, s: mx ? d / mx : 0 };
}

function lees(spoor, definitief) {
  if (!spoor.bron) return;
  const N = raster, blok = BRON / N;
  const d = spoor.bron.getContext('2d', { willReadFrequently: true })
                      .getImageData(0, 0, BRON, BRON).data;

  const cellen = [];
  for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) {
    let r = 0, g = 0, b = 0, n = 0;
    for (let y = Math.floor(cy * blok); y < Math.floor((cy + 1) * blok); y++)
      for (let x = Math.floor(cx * blok); x < Math.floor((cx + 1) * blok); x++) {
        const p = (y * BRON + x) * 4;
        r += d[p]; g += d[p + 1]; b += d[p + 2]; n++;
      }
    r /= n; g /= n; b /= n;
    const hs = rgbNaarHS(r, g, b);
    cellen.push({ L: (0.2126*r + 0.7152*g + 0.0722*b) / 255, S: hs.s, H: hs.h,
                  aan: false, graad: 0, kracht: 0.6 });
  }

  const gem = cellen.reduce((a, c) => a + c.L, 0) / cellen.length;
  const spreiding = Math.sqrt(cellen.reduce((a, c) => a + (c.L - gem) ** 2, 0) / cellen.length);
  const drempel = gem + spreiding * 0.35;
  const max = Math.max(...cellen.map(c => c.L));

  // vangnet: nooit stilte, nooit gehamer
  const rang = cellen.map((c, i) => i).sort((a, b) => cellen[b].L - cellen[a].L);
  let aantal = cellen.filter(c => c.L > drempel).length;
  aantal = Math.max(2, Math.min(Math.round(cellen.length * 0.6), aantal));
  for (let k = 0; k < aantal; k++) cellen[rang[k]].aan = true;

  const bereik = Math.max(max - drempel, 0.02);
  for (const c of cellen) {
    if (!c.aan) continue;
    const hoog = Math.min(1, Math.max(0, (c.L - drempel) / bereik));
    c.graad  = Math.round(hoog * 7);
    c.kracht = 0.40 + Math.min(1, c.S * 1.4) * 0.60;
  }

  spoor.cellen = cellen;
  spoor.tikken = aantal;
  spoor.licht = gem;
  spoor.contrast = Math.min(1, spreiding * 3.2);

  if (!toonsoortGezet) {
    let hx = 0, hy = 0, sw = 0;
    for (const c of cellen) { const w = c.S; hx += Math.cos(c.H*6.283)*w; hy += Math.sin(c.H*6.283)*w; sw += w; }
    const namen = Object.keys(SCHALEN);
    if (sw > cellen.length * 0.08) {
      let h = Math.atan2(hy, hx) / 6.283; if (h < 0) h += 1;
      schaal = namen[Math.floor(h * namen.length) % namen.length];
    }
    if (definitief) toonsoortGezet = true;
  }
}

// ── klankfabriek ───────────────────────────────────────────────────────────
// Alles wordt in een OfflineAudioContext opgebouwd, dus elke functie krijgt de
// context mee.
function bouwGraf(ac) {
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 8; comp.attack.value = 0.004;
  comp.connect(ac.destination);

  const bus = ac.createGain(); bus.gain.value = 0.8;
  bus.connect(comp);

  const delay = ac.createDelay(1.0); delay.delayTime.value = 60 / bpm / 2;
  const fb = ac.createGain(); fb.gain.value = 0.26;
  const send = ac.createGain(); send.gain.value = 0.16;
  bus.connect(send).connect(delay).connect(fb).connect(delay);
  delay.connect(comp);

  const len = Math.floor(ac.sampleRate * 2);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const kanaal = buf.getChannelData(0);
  for (let i = 0; i < len; i++) kanaal[i] = Math.random() * 2 - 1;
  const ruis = ac.createBufferSource(); ruis.buffer = buf; ruis.loop = true; ruis.start(0);

  return { bus, ruis };
}

// Noten worden vooruit gepland in oplopende tijd; cancelScheduledValues ruimt
// op wat er van de vorige noot nog na dit moment stond.
function env(param, t, top, aanslag, verval) {
  param.cancelScheduledValues(t);
  param.setValueAtTime(0.0001, t);
  param.linearRampToValueAtTime(top, t + aanslag);
  param.exponentialRampToValueAtTime(0.0001, t + aanslag + verval);
}

function freq(graad, oct) {
  const s = SCHALEN[schaal];
  const o = Math.floor(graad / s.length);
  return GRONDTOON * Math.pow(2, ((oct + o) * 12 + s[((graad % s.length) + s.length) % s.length]) / 12);
}

function maakMotor(ac, graf, id) {
  const uit = ac.createGain(); uit.gain.value = 1; uit.connect(graf.bus);

  if (id === 'kick') {
    const osc = ac.createOscillator(); osc.type = 'sine';
    const g = ac.createGain(); g.gain.value = 0;
    osc.connect(g).connect(uit); osc.start(0);
    return { uit, speel(t, c, sp) {
      osc.frequency.cancelScheduledValues(t);
      osc.frequency.setValueAtTime(120 + sp.licht * 90, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.09);
      env(g.gain, t, 0.85 * c.kracht, 0.004, 0.34 - sp.contrast * 0.16);
    }};
  }

  if (id === 'hihat' || id === 'clap') {
    const hi = id === 'hihat';
    const fil = ac.createBiquadFilter();
    fil.type = hi ? 'highpass' : 'bandpass'; fil.Q.value = hi ? 0.7 : 1.6;
    const g = ac.createGain(); g.gain.value = 0;
    graf.ruis.connect(fil).connect(g).connect(uit);
    return { uit, speel(t, c, sp) {
      fil.frequency.cancelScheduledValues(t);
      fil.frequency.setValueAtTime(hi ? 4500 + sp.licht * 5000 : 900 + sp.licht * 1600, t);
      const lengte = hi ? 0.02 + (1 - sp.contrast) * 0.10 : 0.05 + (1 - sp.contrast) * 0.16;
      env(g.gain, t, (hi ? 0.22 : 0.40) * c.kracht, 0.002, lengte);
    }};
  }

  // De klinkende instrumenten krijgen meerdere stemmen die om de beurt aan de
  // slag gaan, zodat een noot mag uitklinken terwijl de volgende begint. In een
  // offline render kost dat niets aan afspeeltijd.
  const oct = INSTRUMENTEN.find(x => x.id === id).oct;
  const bel = id === 'bel';
  const aantal = id === 'bas' ? 1 : 3;        // bas blijft monofoon, dat hoort zo
  const stemmen = [];
  for (let i = 0; i < aantal; i++)
    stemmen.push(id === 'pad' ? maakPadStem(ac, uit) : maakToonStem(ac, uit, bel));
  let beurt = 0;
  return { uit, speel(t, c, sp) { stemmen[beurt++ % stemmen.length].raak(t, c, sp, oct); } };
}

function maakPadStem(ac, uit) {
  const fil = ac.createBiquadFilter(); fil.type = 'lowpass'; fil.Q.value = 1;
  const g = ac.createGain(); g.gain.value = 0;
  const oscs = [0, 2, 4].map(() => {
    const o = ac.createOscillator(); o.type = 'sawtooth';
    const og = ac.createGain(); og.gain.value = 0.3;
    o.connect(og).connect(fil); o.start(0); return o;
  });
  fil.connect(g).connect(uit);
  return { raak(t, c, sp, oct) {
    [0, 2, 4].forEach((stap, i) => {                     // drieklank binnen de ladder
      oscs[i].frequency.cancelScheduledValues(t);
      oscs[i].frequency.setValueAtTime(freq(c.graad + stap, oct), t);
    });
    fil.frequency.cancelScheduledValues(t);
    fil.frequency.setValueAtTime(400 + sp.licht * 2600, t);
    env(g.gain, t, 0.16 * c.kracht, 0.12, 0.5 + (1 - sp.contrast) * 1.8);
  }};
}

function maakToonStem(ac, uit, bel) {
  const osc = ac.createOscillator(); osc.type = bel ? 'triangle' : 'sawtooth';
  const fil = ac.createBiquadFilter(); fil.type = 'lowpass'; fil.Q.value = bel ? 1.2 : 3;
  const g = ac.createGain(); g.gain.value = 0;
  osc.connect(fil).connect(g).connect(uit); osc.start(0);
  return { raak(t, c, sp, oct) {
    const f = freq(c.graad, oct);
    osc.frequency.cancelScheduledValues(t);
    osc.frequency.setValueAtTime(f, t);
    fil.frequency.cancelScheduledValues(t);
    fil.frequency.setValueAtTime(f * (bel ? 4 : 2.5) + sp.licht * 3000, t);
    fil.frequency.exponentialRampToValueAtTime(Math.max(f * 1.4, 180), t + 0.4);
    env(g.gain, t, (bel ? 0.20 : 0.32) * c.kracht, 0.006,
        (bel ? 0.5 : 0.28) + (1 - sp.contrast) * (bel ? 1.4 : 0.5));
  }};
}

// ── bouncen ────────────────────────────────────────────────────────────────
function stapDuur(s) {
  const basis = 60 / bpm / 4;
  return s % 2 === 0 ? basis * (1 + SWING) : basis * (1 - SWING);
}

// begintijden van alle stappen binnen één lus, plus de totale lengte
function lusTijden(n) {
  const t = []; let L = 0;
  for (let s = 0; s < n; s++) { t.push(L); L += stapDuur(s); }
  return { t, duur: L };
}

const track = document.getElementById('track');
const bezigEl = document.getElementById('bezig');
let huidigeUrl = null;

async function bounce() {
  if (rendertNu) { opnieuwNodig = true; return; }
  // een spoor dat op dit moment gefotografeerd wordt hoor je live, dus dat laten
  // we hier weg — anders klinkt het dubbel
  const meedoen = sp => sp.cellen && !sp.stil && !sp.opnemen;
  if (!sporen.some(meedoen)) { track.pause(); speelt = false; ververOnder(); return; }

  rendertNu = true; bezigEl.classList.add('aan');
  const positie = lusDuur ? (track.currentTime % lusDuur) : 0;

  const n = raster * raster;
  const { t: tijden, duur: L } = lusTijden(n);

  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oc = new OAC(2, Math.ceil((L + STAART) * SR), SR);
  const graf = bouwGraf(oc);
  const motoren = sporen.map(sp => meedoen(sp) ? maakMotor(oc, graf, sp.instrument) : null);

  for (let s = 0; s < n; s++) {
    sporen.forEach((sp, i) => {
      if (!motoren[i]) return;
      const c = sp.cellen[s];
      if (c && c.aan) motoren[i].speel(tijden[s] + 0.002, c, sp);
    });
  }

  let klaar; const wacht = new Promise(r => klaar = r);
  oc.oncomplete = e => klaar(e.renderedBuffer);
  const p = oc.startRendering();
  const buf = (p && p.then) ? await p : await wacht;

  // De uitloop van de laatste noten valt buiten de lus. Die vouwen we op het
  // begin terug, zodat een galmstaart over het naadje heen doorloopt.
  const lusSamples = Math.round(L * SR);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i + lusSamples < d.length; i++) d[i] += d[i + lusSamples];
  }

  const url = URL.createObjectURL(naarWav(buf, lusSamples, HERHALINGEN));
  stapTijden = tijden; lusDuur = L;
  await zetBron(url, positie < L ? positie : 0);

  rendertNu = false; bezigEl.classList.remove('aan');
  ververOnder();
  if (opnieuwNodig) { opnieuwNodig = false; bounce(); }
}

// De lus wordt HERHALINGEN keer in het bestand geplakt. Een <audio>-element
// lust niet gegarandeerd naadloos; met meer herhalingen valt dat ene naadje
// eens per zoveel maten in plaats van elke maat.
function naarWav(buf, lusSamples, herhalingen) {
  const kan = Math.min(2, buf.numberOfChannels);
  const totaal = lusSamples * herhalingen;
  const ab = new ArrayBuffer(44 + totaal * kan * 2);
  const dv = new DataView(ab);
  const schrijf = (p, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(p + i, s.charCodeAt(i)); };
  schrijf(0, 'RIFF'); dv.setUint32(4, 36 + totaal * kan * 2, true); schrijf(8, 'WAVE');
  schrijf(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, kan, true); dv.setUint32(24, SR, true);
  dv.setUint32(28, SR * kan * 2, true); dv.setUint16(32, kan * 2, true); dv.setUint16(34, 16, true);
  schrijf(36, 'data'); dv.setUint32(40, totaal * kan * 2, true);

  const pcm = new Int16Array(ab, 44, totaal * kan);
  const L = buf.getChannelData(0), R = kan > 1 ? buf.getChannelData(1) : L;
  let p = 0;
  for (let h = 0; h < herhalingen; h++)
    for (let i = 0; i < lusSamples; i++) {
      pcm[p++] = Math.max(-1, Math.min(1, L[i])) * 32767;
      pcm[p++] = Math.max(-1, Math.min(1, R[i])) * 32767;
    }
  return new Blob([ab], { type: 'audio/wav' });
}

function zetBron(url, positie) {
  return new Promise(klaar => {
    const oud = huidigeUrl;
    huidigeUrl = url;
    track.src = url;
    track.addEventListener('loadedmetadata', () => {
      try { track.currentTime = positie; } catch (e) {}
      if (speelt) track.play().catch(() => {});
      if (oud) URL.revokeObjectURL(oud);
      klaar();
    }, { once: true });
    track.load();
  });
}

// ── lockscreen ─────────────────────────────────────────────────────────────
function zetMediaSessie() {
  if (!('mediaSession' in navigator)) return;
  const eerste = sporen.find(sp => sp.foto);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'fotostudio', artist: 'fc1042', album: schaal + ' · ' + bpm + ' bpm',
      artwork: eerste ? [{ src: eerste.foto, sizes: '640x640', type: 'image/jpeg' }] : []
    });
    navigator.mediaSession.setActionHandler('play',  () => zetSpelen(true));
    navigator.mediaSession.setActionHandler('pause', () => zetSpelen(false));
  } catch (e) {}
}

function zetSpelen(aan) {
  speelt = aan;
  if (aan) track.play().catch(() => {}); else track.pause();
  ververOnder();
}

// ── beeld ──────────────────────────────────────────────────────────────────
const sporenEl = document.getElementById('sporen');
const speelKnop = document.getElementById('speel');

function ververOnder() {
  speelKnop.innerHTML = speelt ? icoon('pauze') : speelIcoon();
  speelKnop.disabled = !sporen.some(s => s.cellen);
}

function knopje(naam, actie) {
  const b = document.createElement('button');
  b.innerHTML = icoon(naam);
  b.onclick = e => { e.stopPropagation(); actie(); };
  return b;
}

function tekenSporen() {
  sporenEl.innerHTML = '';

  sporen.forEach((sp, i) => {
    const tegel = document.createElement('div');
    tegel.className = 'tegel' + (sp.stil ? ' gedempt' : '');
    tegel.dataset.i = i;

    if (sp.foto) { const img = document.createElement('img'); img.src = sp.foto; tegel.appendChild(img); }

    if (sp.cellen) {
      const net = document.createElement('div');
      net.className = 'net';
      net.style.gridTemplateColumns = 'repeat(' + raster + ', 1fr)';
      net.style.gridTemplateRows = 'repeat(' + raster + ', 1fr)';
      sp.cellen.forEach(c => {
        const e = document.createElement('i');
        if (c.aan) e.className = 'aan';
        net.appendChild(e);
      });
      net.onclick = () => toonGroot(i);          // op de foto tikken = groot bekijken
      tegel.appendChild(net);
    }

    const balk = document.createElement('div');
    balk.className = 'balk';
    const klank = document.createElement('button');
    klank.className = 'klank';
    klank.innerHTML = golfPad(sp.instrument);    // het golfje ís de naam van het geluid
    klank.onclick = e => { e.stopPropagation(); openKiezer(i, true); };
    balk.append(
      klank,
      knopje('camera', () => openZoeker(sp.instrument, i)),
      knopje(sp.stil ? 'dof' : 'luid', () => { sp.stil = !sp.stil; tekenSporen(); bounce(); }),
      knopje('prul', () => wisSpoor(i))
    );
    tegel.appendChild(balk);
    sporenEl.appendChild(tegel);
  });

  const plus = document.createElement('button');
  plus.className = 'tegel nieuw';
  plus.innerHTML = icoon('plus', 26);
  plus.onclick = nieuwSpoor;
  sporenEl.appendChild(plus);

  ververOnder();
}

function nieuwSpoor() {
  sporen.push({ instrument: 'kick', bron: null, foto: null, cellen: null, stil: false });
  openKiezer(sporen.length - 1, false);
}

function wisSpoor(i) {
  sporen.splice(i, 1);
  tekenSporen();
  zetMediaSessie();
  bounce();
}

// speelkop volgt de audiotrack zelf — geen aparte klok, dus nooit uit de pas
function speelkop() {
  requestAnimationFrame(speelkop);
  if (!lusDuur || track.paused) return;
  const t = track.currentTime % lusDuur;
  let nr = 0;
  while (nr + 1 < stapTijden.length && stapTijden[nr + 1] <= t) nr++;

  sporenEl.querySelectorAll('.tegel').forEach(tegel => {
    const sp = sporen[+tegel.dataset.i];
    const els = tegel.querySelectorAll('.net i');
    if (!sp || !sp.cellen || !els.length) return;
    for (const e of els) e.classList.remove('nu', 'vuur');
    const cel = els[nr];
    if (!cel) return;
    cel.classList.add('nu');
    if (sp.cellen[nr] && sp.cellen[nr].aan && !sp.stil) cel.classList.add('vuur');
  });

  const gnet = document.getElementById('grootNet');
  if (document.getElementById('groot').classList.contains('aan') && gnet.children[nr]) {
    for (const e of gnet.children) e.classList.remove('nu', 'vuur');
    gnet.children[nr].classList.add('nu');
    const sp = sporen[grootIndex];
    if (sp && sp.cellen[nr] && sp.cellen[nr].aan) gnet.children[nr].classList.add('vuur');
  }
}
requestAnimationFrame(speelkop);

// ── de foto groot ──────────────────────────────────────────────────────────
const grootEl = document.getElementById('groot');
let grootIndex = 0;

function toonGroot(i) {
  const sp = sporen[i];
  if (!sp.foto) return;
  grootIndex = i;
  document.getElementById('grootFoto').src = sp.foto;
  const houder = document.getElementById('grootNet');
  houder.innerHTML = '';
  houder.style.gridTemplateColumns = 'repeat(' + raster + ', 1fr)';
  houder.style.gridTemplateRows = 'repeat(' + raster + ', 1fr)';
  sp.cellen.forEach(c => {
    const e = document.createElement('i');
    if (c.aan) e.className = 'aan';
    houder.appendChild(e);
  });
  grootEl.classList.add('aan');
}
grootEl.onclick = () => grootEl.classList.remove('aan');

// ── geluid kiezen ──────────────────────────────────────────────────────────
const kiezerEl = document.getElementById('kiezer');
const lijstEl = kiezerEl.querySelector('.lijst');
let doel = -1, alleenGeluid = false;

INSTRUMENTEN.forEach(inst => {
  const b = document.createElement('button');
  b.innerHTML = golfPad(inst.id) + '<span>' + inst.naam + '</span>';
  b.onclick = () => kiesInstrument(inst.id);
  lijstEl.appendChild(b);
});

function openKiezer(i, wisselen) {
  doel = i; alleenGeluid = !!wisselen;
  ontgrendel();
  kiezerEl.classList.add('aan');
}

document.getElementById('kiezerUit').innerHTML = icoon('terug', 22);
document.getElementById('kiezerUit').onclick = () => {
  kiezerEl.classList.remove('aan');
  if (!alleenGeluid && sporen[doel] && !sporen[doel].cellen) { sporen.splice(doel, 1); tekenSporen(); }
};

function kiesInstrument(id) {
  kiezerEl.classList.remove('aan');
  if (alleenGeluid) {                          // foto blijft staan, alleen het geluid wisselt
    sporen[doel].instrument = id;
    tekenSporen();
    bounce();
    return;
  }
  openZoeker(id, doel);
}

// ── camera ─────────────────────────────────────────────────────────────────
const zoekerEl = document.getElementById('zoeker');
const video = document.getElementById('cam');
const lijnen = document.getElementById('lijnen');
const camKnop = document.getElementById('camkeuze');
const tip = document.getElementById('tip');
let stream = null, voorbeeldKlok = null, backup = null, verseTegel = false;
let camApparaten = [], camKeuze = 0, gespiegeld = true;

document.getElementById('zoekerUit').innerHTML = icoon('terug', 22);
camKnop.innerHTML = icoon('draai', 22);

async function ververCams() {
  try {
    camApparaten = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  } catch (e) { camApparaten = []; }
  if (stream) {
    const s = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
    const idx = camApparaten.findIndex(d => d.deviceId === s.deviceId);
    if (idx >= 0) camKeuze = idx;
  }
  camKnop.style.display = camApparaten.length > 1 ? 'block' : 'none';
}

async function startStream() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const eis = { width: { ideal: 1280 }, height: { ideal: 960 } };
  if (camApparaten[camKeuze]) eis.deviceId = { exact: camApparaten[camKeuze].deviceId };
  else eis.facingMode = 'user';
  stream = await navigator.mediaDevices.getUserMedia({ video: eis, audio: false });
  video.srcObject = stream;
  await video.play();
  const s = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
  gespiegeld = s.facingMode !== 'environment';       // jezelf gespiegeld, de achterkant niet
  video.style.transform = gespiegeld ? 'scaleX(-1)' : 'none';
}

camKnop.onclick = async () => {
  if (camApparaten.length < 2) return;
  camKeuze = (camKeuze + 1) % camApparaten.length;
  try { await startStream(); } catch (e) {}
};

async function openZoeker(instrumentId, i) {
  doel = i;
  ontgrendel();
  const sp = sporen[i];
  sp.instrument = instrumentId;
  verseTegel = !sp.cellen;
  backup = sp.cellen ? { bron: sp.bron, foto: sp.foto, cellen: sp.cellen, tikken: sp.tikken,
                         licht: sp.licht, contrast: sp.contrast } : null;
  sp.bron = null;
  sp.opnemen = true;                       // uit de plaat halen; je hoort 'm nu live
  bounce();

  tip.classList.remove('weg');
  setTimeout(() => tip.classList.add('weg'), 3200);
  zoekerEl.classList.add('aan');
  lijnen.style.gridTemplateColumns = 'repeat(' + raster + ', 1fr)';
  lijnen.style.gridTemplateRows = 'repeat(' + raster + ', 1fr)';
  lijnen.innerHTML = '<i></i>'.repeat(raster * raster);

  try { await startStream(); await ververCams(); }
  catch (e) { tip.classList.remove('weg'); tip.textContent = 'geen camera'; return; }
  startVoorbeeld();
  startMeeluisteren(sp);
}

// ── live meeluisteren tijdens het richten ──────────────────────────────────
// De plaat loopt door als <audio>; het spoor dat je nu fotografeert klinkt uit
// een kleine live AudioContext eroverheen. Die twee klokken haken we aan
// elkaar: de positie in de audiotrack bepaalt waar de live-lus staat, en bij
// elke ronde trekken we de fase weer recht.
let pctx = null, pgraf = null, pmotor = null, pklok = null, vbBasis = 0, vbStap = 0;
const VOORUIT = 0.12;

function startMeeluisteren(sp) {
  stopMeeluisteren();
  if (!pctx) {
    pctx = new (window.AudioContext || window.webkitAudioContext)();
    pgraf = bouwGraf(pctx);
  }
  pctx.resume();
  pmotor = maakMotor(pctx, pgraf, sp.instrument);

  const n = raster * raster;
  const { t, duur: L } = lusTijden(n);
  const pos = (!track.paused && lusDuur) ? (track.currentTime % lusDuur) : 0;
  vbBasis = pctx.currentTime - pos + 0.06;
  vbStap = 0;
  while (vbStap < n && vbBasis + t[vbStap] < pctx.currentTime + 0.02) vbStap++;
  if (vbStap >= n) { vbStap = 0; vbBasis += L; }

  pklok = setInterval(() => voorbeeldTik(sp), 25);
}

function stopMeeluisteren() {
  clearInterval(pklok); pklok = null;
  if (pmotor) { pmotor.uit.disconnect(); pmotor = null; }
  if (pctx) pctx.suspend();
}

function voorbeeldTik(sp) {
  if (!pctx || !pmotor || !sp.cellen) return;
  const n = raster * raster;
  const { t, duur: L } = lusTijden(n);
  const nu = pctx.currentTime;

  if (vbBasis + L < nu) { vbBasis = nu + 0.05; vbStap = 0; }   // ver achterop: opnieuw aanhaken

  // fase bijtrekken op de lopende plaat
  if (!track.paused && lusDuur && Math.abs(L - lusDuur) < 0.001) {
    const zouMoeten = nu - (track.currentTime % lusDuur);
    let fout = (vbBasis - zouMoeten) % L;
    if (fout > L / 2) fout -= L; else if (fout < -L / 2) fout += L;
    if (Math.abs(fout) > 0.02) vbBasis -= fout;
  }

  let veilig = 0;
  while (vbBasis + t[vbStap] < nu + VOORUIT && veilig++ < 64) {
    const tijd = vbBasis + t[vbStap];
    const c = sp.cellen[vbStap];
    if (c && c.aan && tijd > nu) pmotor.speel(tijd, c, sp);
    vbStap++;
    if (vbStap >= n) { vbStap = 0; vbBasis += L; }
  }
}

// Naast het horen zie je ook live welke vakjes gaan klinken — het raster op de
// zoeker licht mee met wat je in beeld hebt.
function startVoorbeeld() {
  stopVoorbeeld();
  voorbeeldKlok = setInterval(() => {
    if (!stream || video.readyState < 2) return;
    const sp = sporen[doel];
    if (!vangFrame(sp)) return;
    lees(sp, false);
    for (let k = 0; k < lijnen.children.length; k++)
      lijnen.children[k].classList.toggle('aan', !!(sp.cellen[k] && sp.cellen[k].aan));
  }, 110);
}
function stopVoorbeeld() { clearInterval(voorbeeldKlok); voorbeeldKlok = null; }

function knip(doelCanvas, maat) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return false;
  const z = Math.min(vw, vh), sx = (vw - z) / 2, sy = (vh - z) / 2;
  const g = doelCanvas.getContext('2d', { willReadFrequently: true });
  g.save();
  if (gespiegeld) { g.scale(-1, 1); g.drawImage(video, sx, sy, z, z, -maat, 0, maat, maat); }
  else            { g.drawImage(video, sx, sy, z, z, 0, 0, maat, maat); }
  g.restore();
  return true;
}

function vangFrame(sp) {
  if (!sp.bron) { sp.bron = document.createElement('canvas'); sp.bron.width = sp.bron.height = BRON; }
  return knip(sp.bron, BRON);
}

// de foto zelf bewaren we groot genoeg om terug te kijken
function bewaarFoto(sp) {
  const c = document.createElement('canvas'); c.width = c.height = BEWAAR;
  if (!knip(c, BEWAAR)) return;
  sp.foto = c.toDataURL('image/jpeg', 0.72);
}

function sluitZoeker() {
  stopVoorbeeld();
  stopMeeluisteren();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  zoekerEl.classList.remove('aan');
}

document.getElementById('sluiter').onclick = () => {
  if (!stream) return;
  const sp = sporen[doel];
  stopVoorbeeld();
  if (!vangFrame(sp)) return;
  lees(sp, true);
  bewaarFoto(sp);
  backup = null;
  sp.opnemen = false;

  const flits = document.getElementById('flits');
  flits.style.transition = 'none'; flits.style.opacity = '0.95';
  requestAnimationFrame(() => { flits.style.transition = 'opacity 380ms'; flits.style.opacity = '0'; });

  sluitZoeker();
  speelt = true;
  tekenSporen();
  zetMediaSessie();
  bounce();
};

document.getElementById('zoekerUit').onclick = () => {
  const sp = sporen[doel];
  if (backup) Object.assign(sp, backup);
  sp.opnemen = false;
  if (!backup && verseTegel) sporen.splice(doel, 1);
  backup = null;
  sluitZoeker();
  tekenSporen();
  bounce();                                 // het spoor weer in de plaat zetten
};

// ── onderbalk ──────────────────────────────────────────────────────────────
speelKnop.onclick = () => { ontgrendel(); zetSpelen(!speelt); };

document.getElementById('tempo').onclick = e => {
  bpm = TEMPOS[(TEMPOS.indexOf(bpm) + 1) % TEMPOS.length];
  e.target.textContent = bpm;
  zetMediaSessie();
  bounce();
};

document.getElementById('rasterknop').onclick = e => {
  raster = RASTERS[(RASTERS.indexOf(raster) + 1) % RASTERS.length];
  e.target.textContent = raster + '×' + raster;
  sporen.forEach(sp => { if (sp.bron) lees(sp, true); });
  tekenSporen();
  bounce();
};

// iOS laat een <audio> alleen spelen als hij ooit door een echte tik is
// aangezet. Dus doen we dat bij de eerste aanraking, met een halve seconde
// stilte; daarna mag het script hem zelf starten en van bron wisselen.
let ontgrendeld = false;
function ontgrendel() {
  if (ontgrendeld || huidigeUrl) return;
  ontgrendeld = true;
  const n = Math.floor(SR / 2);
  const ab = new ArrayBuffer(44 + n);
  const dv = new DataView(ab);
  const s = (p, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(p + i, t.charCodeAt(i)); };
  s(0, 'RIFF'); dv.setUint32(4, 36 + n, true); s(8, 'WAVE'); s(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, SR, true); dv.setUint32(28, SR, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  s(36, 'data'); dv.setUint32(40, n, true);
  new Uint8Array(ab, 44).fill(128);
  track.src = URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
  track.play().then(() => track.pause()).catch(() => {});
}

track.addEventListener('play',  () => { speelt = true; ververOnder(); });
track.addEventListener('pause', () => { if (!rendertNu) { speelt = false; ververOnder(); } });

tekenSporen();
</script>
