<!DOCTYPE html>

<title>Maas — erosie (druppels)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#07080a; overflow:hidden; cursor:none; }
  canvas { display:block; width:100%; height:100%; }

<body>
<canvas id="c"></canvas>
<script src="../maas.js"></script>
<script>
// maas — exp-0: EROSIE
// ============================================================================
// Een vlakte met een flauwe helling. Verder niets. Daar laat de echte afvoer van
// de Maas dertig jaar lang op los wat afvoer in de wereld ook doet: bij hoogwater
// slijpt water zich in en voert het materiaal af, bij laagwater zakt het bezinksel
// terug in de geulen.
//
// Er wordt niets vertaald. Geen kleur die "veel water" betekent, geen vorm die
// iets voorstelt. Wat je ziet is het dal dat er na dertig jaar ligt — en januari
// 2011 en juli 2021 hebben er hun sporen in achtergelaten die er nooit meer uit
// gaan. Het beeld heeft een geheugen.
//
// Bij het openen zie je die dertig jaar in een halve minuut gebeuren. Daarna
// staat het stil en komt er nog één dag per dag bij, wat je niet zult zien.

// ---- KERN ----
function maakTerrein(n, seed) {
  // deterministische ruis: iedereen die de pagina opent begint op dezelfde vlakte
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const h = new Float32Array(n * n);
  // waardenruis over een paar octaven, opgeteld bij een flauwe helling
  for (let oct = 0, amp = 0.075, cel = 8; oct < 5; oct++, amp *= 0.5, cel *= 2) {
    const m = Math.ceil(n / cel) + 2;
    const g = new Float32Array(m * m);
    for (let i = 0; i < m * m; i++) g[i] = rnd();
    for (let y = 0; y < n; y++) {
      const gy = y / cel, y0 = Math.floor(gy), fy = gy - y0;
      const wy = fy * fy * (3 - 2 * fy);
      for (let x = 0; x < n; x++) {
        const gx = x / cel, x0 = Math.floor(gx), fx = gx - x0;
        const wx = fx * fx * (3 - 2 * fx);
        const a = g[y0 * m + x0], b = g[y0 * m + x0 + 1];
        const c = g[(y0 + 1) * m + x0], d = g[(y0 + 1) * m + x0 + 1];
        h[y * n + x] += amp * ((a + (b - a) * wx) + ((c + (d - c) * wx) - (a + (b - a) * wx)) * wy);
      }
    }
  }
  for (let y = 0; y < n; y++)
    for (let x = 0; x < n; x++)
      h[y * n + x] += 0.55 * (1 - y / (n - 1));    // helling naar beneden toe
  return h;
}

function maakErosie(n, seed) {
  const h = maakTerrein(n, seed);
  let s = (seed * 2654435761) >>> 0;
  const rnd = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const TRAAGHEID = 0.05, ZWAARTE = 4.0, VERDAMPING = 0.015;
  const CAPACITEIT = 3.0, EROSIE = 0.30, AFZET = 0.30, MIN_HELLING = 0.0008;
  const STAPPEN = 64, STRAAL = 2;

  function hoogteEnGradient(x, y) {
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
    const i = y0 * n + x0;
    const nw = h[i], ne = h[i + 1], sw = h[i + n], se = h[i + n + 1];
    return {
      h: nw * (1 - fx) * (1 - fy) + ne * fx * (1 - fy) + sw * (1 - fx) * fy + se * fx * fy,
      gx: (ne - nw) * (1 - fy) + (se - sw) * fy,
      gy: (sw - nw) * (1 - fx) + (se - ne) * fx,
    };
  }

  function penseel(x, y, bedrag) {
    // uitsmeren over een paar cellen, anders krijg je putjes in plaats van geulen
    const x0 = Math.max(1, (x | 0) - STRAAL), x1 = Math.min(n - 2, (x | 0) + STRAAL);
    const y0 = Math.max(1, (y | 0) - STRAAL), y1 = Math.min(n - 2, (y | 0) + STRAAL);
    let som = 0;
    for (let yy = y0; yy <= y1; yy++)
      for (let xx = x0; xx <= x1; xx++) {
        const d = Math.hypot(xx - x, yy - y);
        if (d < STRAAL) som += STRAAL - d;
      }
    if (som <= 0) return;
    for (let yy = y0; yy <= y1; yy++)
      for (let xx = x0; xx <= x1; xx++) {
        const d = Math.hypot(xx - x, yy - y);
        if (d < STRAAL) h[yy * n + xx] += bedrag * (STRAAL - d) / som;
      }
  }

  function druppel(kracht) {
    let x = 1 + rnd() * (n - 3), y = 1 + rnd() * (n - 3);
    let dx = 0, dy = 0, snelheid = 1, water = 1, sed = 0;
    for (let stap = 0; stap < STAPPEN; stap++) {
      const g = hoogteEnGradient(x, y);
      dx = dx * TRAAGHEID - g.gx * (1 - TRAAGHEID);
      dy = dy * TRAAGHEID - g.gy * (1 - TRAAGHEID);
      const len = Math.hypot(dx, dy);
      if (len < 1e-6) break;                       // in een kuil beland
      dx /= len; dy /= len;
      const nx = x + dx, ny = y + dy;
      if (nx < 1 || nx >= n - 2 || ny < 1 || ny >= n - 2) break;
      const nieuw = hoogteEnGradient(nx, ny).h;
      const verschil = nieuw - g.h;

      if (verschil > 0) {                          // bergop: alles valt hier neer
        const leg = Math.min(sed, verschil);
        penseel(x, y, leg); sed -= leg;
      } else {
        const cap = Math.max(-verschil, MIN_HELLING) * snelheid * water * CAPACITEIT * kracht;
        if (sed > cap) {
          const leg = (sed - cap) * AFZET;
          penseel(x, y, leg); sed -= leg;
        } else {
          const pak = Math.min((cap - sed) * EROSIE, -verschil);
          penseel(x, y, -pak); sed += pak;
        }
      }
      snelheid = Math.sqrt(Math.max(0, snelheid * snelheid - verschil * ZWAARTE));
      water *= (1 - VERDAMPING);
      x = nx; y = ny;
    }
  }

  // laagwater: het bezinksel zakt terug en vult de geulen een klein beetje op
  function afzetting(kracht) {
    const kopie = h.slice();
    for (let y = 1; y < n - 1; y++)
      for (let x = 1; x < n - 1; x++) {
        const i = y * n + x;
        const gem = (kopie[i - 1] + kopie[i + 1] + kopie[i - n] + kopie[i + n]) * 0.25;
        if (kopie[i] < gem) h[i] += (gem - kopie[i]) * kracht;
      }
  }

  return {
    hoogte: h,
    n,
    // p = waar de rivier vandaag staat, 0 = laagste ooit, 1 = hoogste ooit
    dag(p) {
      const druppels = Math.round(1 + 90 * p * p);
      const kracht = 0.35 + 2.2 * p;
      for (let i = 0; i < druppels; i++) druppel(kracht);
      const stil = Math.max(0, 1 - p * 2.4);
      if (stil > 0) afzetting(0.010 * stil * stil);
    },
  };
}
// ---- EINDE KERN ----

(async function () {
  const N = 320;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const beeld = ctx.createImageData(N, N);
  const buffer = document.createElement('canvas');
  buffer.width = buffer.height = N;
  const bctx = buffer.getContext('2d');

  function pasAan() {
    canvas.width = Math.floor(innerWidth * devicePixelRatio);
    canvas.height = Math.floor(innerHeight * devicePixelRatio);
  }
  addEventListener('resize', pasAan); pasAan();

  function teken(h) {
    // schaduwrelief: geen kleur die iets betekent, alleen licht op een vorm
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < h.length; i++) { if (h[i] < lo) lo = h[i]; if (h[i] > hi) hi = h[i]; }
    const bereik = Math.max(1e-6, hi - lo);
    const d = beeld.data;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const i = y * N + x;
        const xl = h[i - (x > 0 ? 1 : 0)], xr = h[i + (x < N - 1 ? 1 : 0)];
        const yu = h[i - (y > 0 ? N : 0)], yd = h[i + (y < N - 1 ? N : 0)];
        const nx = (xl - xr) * 42, ny = (yu - yd) * 42;
        const nl = Math.sqrt(nx * nx + ny * ny + 1);
        const licht = Math.max(0, (nx * -0.55 + ny * -0.62 + 0.56) / nl);
        const hoog = (h[i] - lo) / bereik;
        const t = 0.10 + 0.90 * Math.pow(licht, 1.35);
        const bodem = 0.28 + 0.72 * hoog;
        const r = 255 * t * (0.30 + 0.62 * bodem);
        const g = 255 * t * (0.31 + 0.60 * bodem);
        const b = 255 * t * (0.34 + 0.52 * bodem);
        const j = i * 4;
        d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = 255;
      }
    }
    bctx.putImageData(beeld, 0, 0);
    const schaal = Math.max(canvas.width / N, canvas.height / N);
    const w = N * schaal, hh = N * schaal;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(buffer, (canvas.width - w) / 2, (canvas.height - hh) / 2, w, hh);
  }

  const scherm = MAAS.scherm('dertig jaar Maas   ·   d = cijfers   ·   r = opnieuw');
  let data;
  try {
    data = await MAAS.laad();
  } catch (e) {
    document.body.style.background = '#07080a';
    scherm.zet('de rivier is even onbereikbaar\n' + e.message);
    return;
  }

  let erosie, dag, klaar;
  function begin() {
    erosie = maakErosie(N, 20110109);   // vaste zaadwaarde: iedereen dezelfde vlakte
    dag = 0; klaar = false;
  }
  begin();
  addEventListener('keydown', (e) => { if (e.key === 'r') begin(); });

  const PER_BEELD = 26;      // dagen per beeldje tijdens het inhalen (~30 jaar in 25s)
  function lus() {
    if (!klaar) {
      const tot = Math.min(data.p.length, dag + PER_BEELD);
      for (; dag < tot; dag++) erosie.dag(data.p[dag]);
      if (dag >= data.p.length) klaar = true;
      teken(erosie.hoogte);
      const i = Math.min(dag, data.p.length - 1);
      scherm.zet(`${data.datums[i]}   ${data.q[i].toFixed(0)} m3/s\n`
        + `${klaar ? 'heden' : 'inhalen'}  ${(100 * dag / data.p.length).toFixed(0)}%\n`
        + `${data.laag.toFixed(0)}–${data.hoog.toFixed(0)} m3/s over ${data.datums.length} dagen`);
    }
    requestAnimationFrame(lus);
  }
  lus();
})();
</script>
</body>
